# SolveLang PR Gate — consumer workflow template for Forgejo Actions.
#
# Copy this file into your repository as .forgejo/workflows/pr-gate.yml
# and replace <PINNED_SHA> with the full commit SHA of saiidz/solvelang
# that contains the version of the kit you want to run (pin a commit,
# never a floating branch). Put a pr-gate.policy.json at your repository
# root (see packages/pr-gate/README.md in saiidz/solvelang for the
# format), or set PR_GATE_POLICY to "" to run report-only with no
# policy.
#
# How this differs from the GitHub template (workflow-template.yml), and
# why. Forgejo Actions is "designed to be familiar to users of GitHub
# Actions, but it is not designed to be compatible"
# (https://forgejo.org/docs/latest/user/actions/github-actions/):
#
#   - There is deliberately NO `permissions:` block: Forgejo ignores
#     the `permissions` and `continue-on-error` job keys. The automatic
#     token's rights come from the instance and repository settings.
#   - The automatic token and API endpoint are read from the
#     FORGEJO_TOKEN and FORGEJO_API_URL environment variables, which
#     Forgejo sets for every action step
#     (https://forgejo.org/docs/latest/user/actions/reference/).
#   - Step outputs are written to $FORGEJO_OUTPUT.
#   - Some keys in the `github` context are missing on Forgejo, so PR
#     facts (labels, base ref, head SHA) are read from the Forgejo API,
#     not from the event payload; only the PR number is taken from the
#     event.
#   - The kit is cloned at the pinned SHA and its CLI is run directly,
#     instead of a composite-action `uses:` step. If your instance
#     cannot reach github.com, mirror saiidz/solvelang and point
#     PR_GATE_KIT_URL at the mirror.
#   - The sticky comment is posted through the Forgejo REST API (the
#     issues comments endpoints — a PR comment is an issue comment),
#     not actions/github-script.
#   - The gate signal is a commit status posted to the PR head commit
#     (POST /repos/{owner}/{repo}/statuses/{sha}, context "pr-gate").
#     Forgejo has no Checks API; branch protection gates on status
#     contexts, so add the "pr-gate" context to your protected branch's
#     required status checks to make the gate block merges.
#   - Most Forgejo runners use a Debian image with Node.js by default
#     (unlike GitHub's larger ubuntu image), so the setup-node step is
#     usually unnecessary; it is kept so the template also works on
#     runners without Node 22. runs-on must match your runner's labels;
#     "docker" is the label used in Forgejo's own examples.

name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  # report-only: the status stays green and the report is advisory.
  # enforce: the status (and the job) fail when a policy rule fails.
  PR_GATE_MODE: report-only
  PR_GATE_POLICY: pr-gate.policy.json
  PR_GATE_KIT_URL: https://github.com/saiidz/solvelang.git
  PR_GATE_KIT_SHA: <PINNED_SHA>

jobs:
  pr-gate:
    name: pr-gate
    runs-on: docker
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read PR facts from the Forgejo API
        id: facts
        env:
          PR_GATE_PR: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const api = process.env.FORGEJO_API_URL.replace(/\/+$/, '');
            const token = process.env.FORGEJO_TOKEN || process.env.GITHUB_TOKEN;
            const repoSlug = process.env.GITHUB_REPOSITORY;
            const response = await fetch(`${api}/repos/${repoSlug}/pulls/${process.env.PR_GATE_PR}`, {
              headers: { authorization: `token ${token}`, accept: 'application/json' },
            });
            if (!response.ok) throw new Error(`PR read failed: HTTP ${response.status}`);
            const pr = await response.json();
            const labels = (pr.labels || []).map((label) => label.name).join(',');
            const out = [
              `labels=${labels}`,
              `base-ref=${pr.base.ref}`,
              `head-sha=${pr.head.sha}`,
            ].join('\n') + '\n';
            fs.appendFileSync(process.env.FORGEJO_OUTPUT, out);
            fs.appendFileSync(process.env.FORGEJO_ENV, `PR_GATE_REPO=${repoSlug}\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Install and build the PR Gate kit
        run: |
          KIT_DIR="${RUNNER_TEMP:-$(mktemp -d)}/pr-gate-kit"
          echo "PR_GATE_KIT_DIR=$KIT_DIR" >> "$FORGEJO_ENV"
          git init -q "$KIT_DIR"
          git -C "$KIT_DIR" remote add origin "$PR_GATE_KIT_URL"
          git -C "$KIT_DIR" fetch -q --depth 1 origin "$PR_GATE_KIT_SHA"
          git -C "$KIT_DIR" checkout -q FETCH_HEAD
          cd "$KIT_DIR/packages/pr-gate"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run the PR Gate
        id: gate
        env:
          BASE_REF: ${{ steps.facts.outputs.base-ref }}
          LABELS: ${{ steps.facts.outputs.labels }}
        run: |
          set +e
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD" | paste -sd, -)"
          ARGS=(--root "$GITHUB_WORKSPACE" --changed "$CHANGED" --mode "$PR_GATE_MODE" --out .pr-gate-out)
          if [ -n "$PR_GATE_POLICY" ]; then ARGS+=(--policy "$PR_GATE_POLICY"); fi
          if [ -n "$LABELS" ]; then ARGS+=(--labels "$LABELS"); fi
          node "$PR_GATE_KIT_DIR/packages/pr-gate/dist/packages/pr-gate/src/cli.js" "${ARGS[@]}"
          CODE=$?
          # A crashed CLI also exits 1; without a result file there is no
          # verdict, so treat a missing result.json as operational (exit 2),
          # never as a policy failure.
          if [ ! -f .pr-gate-out/result.json ]; then
            echo "PR Gate produced no result.json (exit $CODE) - operational error."
            exit 2
          fi
          VERDICT=$(node -e "try{const r=JSON.parse(require(fs).readFileSync(.pr-gate-out/result.json,utf8));const e=r.policy&&r.policy.evaluation;process.stdout.write(e?(e.passed?pass:fail):)}catch{process.stdout.write()}")
          echo "verdict=$VERDICT" >> "$FORGEJO_OUTPUT"
          echo "exit-code=$CODE" >> "$FORGEJO_OUTPUT"
          echo "report-path=.pr-gate-out/report.md" >> "$FORGEJO_OUTPUT"
          # Operational errors fail in every mode; policy failures fail only in enforce mode.
          if [ "$CODE" -eq 2 ]; then exit 2; fi
          if [ "$CODE" -eq 1 ] && [ "$PR_GATE_MODE" = "enforce" ]; then exit 1; fi
          exit 0

      - name: Post or update the sticky PR comment
        if: always()
        env:
          PR_GATE_PR: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const marker = '<!-- pr-gate:report -->';
            let body;
            try {
              body = fs.readFileSync('.pr-gate-out/report.md', 'utf8');
            } catch {
              body = marker + '\n\n## SolveLang PR Gate\n\nThe PR Gate run failed before it could produce a report. See the workflow run for details.';
            }
            const api = process.env.FORGEJO_API_URL.replace(/\/+$/, '');
            const token = process.env.FORGEJO_TOKEN || process.env.GITHUB_TOKEN;
            const repoSlug = process.env.FORGEJO_REPOSITORY || process.env.GITHUB_REPOSITORY;
            const headers = { authorization: `token ${token}`, accept: 'application/json', 'content-type': 'application/json' };
            const comments = [];
            for (let page = 1; ; page += 1) {
              const response = await fetch(`${api}/repos/${repoSlug}/issues/${process.env.PR_GATE_PR}/comments?page=${page}&limit=50`, { headers });
              if (!response.ok) throw new Error(`Comment list failed: HTTP ${response.status}`);
              const batch = await response.json();
              comments.push(...batch);
              if (batch.length < 50) break;
            }
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            const url = existing
              ? `${api}/repos/${repoSlug}/issues/comments/${existing.id}`
              : `${api}/repos/${repoSlug}/issues/${process.env.PR_GATE_PR}/comments`;
            const response = await fetch(url, { method: existing ? 'PATCH' : 'POST', headers, body: JSON.stringify({ body }) });
            if (!response.ok) throw new Error(`Comment write failed: HTTP ${response.status}`);
            console.log(existing ? `Updated sticky comment ${existing.id}.` : 'Created sticky comment.');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Post the gate commit status
        if: always()
        env:
          GATE_CODE: ${{ steps.gate.outputs.exit-code }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
          HEAD_SHA: ${{ steps.facts.outputs.head-sha }}
        run: |
          TOKEN="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
          REPO_SLUG="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          # Map the verdict recorded in result.json, not the CLI exit code:
          # in report-only mode the CLI exits 0 even on a policy FAIL.
          if [ "$GATE_CODE" = "2" ] || [ -z "$GATE_VERDICT" ]; then
            STATE="error"; DESC="PR Gate run failed operationally — see the PR comment"
          elif [ "$GATE_VERDICT" = "fail" ] && [ "$PR_GATE_MODE" = "enforce" ]; then
            STATE="failure"; DESC="PR Gate policy failed (enforce mode)"
          elif [ "$GATE_VERDICT" = "fail" ]; then
            STATE="success"; DESC="PR Gate policy failed — advisory only (report-only mode)"
          else
            STATE="success"; DESC="PR Gate passed"
          fi
          curl -sS -X POST "$FORGEJO_API_URL/repos/$REPO_SLUG/statuses/$HEAD_SHA" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\": \"$STATE\", \"context\": \"pr-gate\", \"description\": \"$DESC\", \"target_url\": \"\"}"
