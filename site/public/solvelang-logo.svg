<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 200" role="img" aria-labelledby="title desc">
  <title id="title">SolveLang</title>
  <desc id="desc">SolveLang wordmark with a geometric triangular maze and blue solution path.</desc>
  <defs>
