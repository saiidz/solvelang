AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SolveLang API subscription keys, customer accounts, billing lifecycle, authorization, and hard usage limits

Parameters:
  ApiAccessEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  ApiAccessMode:
    Type: String
    AllowedValues: [test, live]
    Default: test
  CustomerAccountsEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  SubscriptionBillingEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  SiteOrigin:
    Type: String
    Default: https://www.solve-lang.com
  ApiKeyPepper:
    Type: String
    NoEcho: true
    MinLength: 32
  ApiAccessAdminSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  CustomerAuthPepper:
    Type: String
    NoEcho: true
    Default: ""
  CustomerAuthEmailSender:
    Type: String
    Default: ""
  CustomerAuthEmailReplyTo:
    Type: String
    Default: ""
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
  StripeSubscriptionWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
  StripeApiDeveloperPriceId:
    Type: String
    Default: ""
  StripeApiProPriceId:
    Type: String
    Default: ""
  StripeApiBusinessPriceId:
    Type: String
    Default: ""

Rules:
  CustomerAccountsRequirements:
    RuleCondition: !Equals [!Ref CustomerAccountsEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ApiAccessEnabled, "true"]
        AssertDescription: Customer accounts require API access to be enabled.
      - Assert: !Not [!Equals [!Ref CustomerAuthPepper, ""]]
        AssertDescription: Customer accounts require a separate authentication pepper.
      - Assert: !Not [!Equals [!Ref CustomerAuthEmailSender, ""]]
        AssertDescription: Customer accounts require a verified SES sender.
  SubscriptionBillingRemainsTestOnly:
    RuleCondition: !Equals [!Ref SubscriptionBillingEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref ApiAccessEnabled, "true"]
        AssertDescription: Subscription billing requires API access to be enabled.
      - Assert: !Equals [!Ref CustomerAccountsEnabled, "true"]
        AssertDescription: Browser subscription billing requires customer accounts to be enabled.
      - Assert: !Equals [!Ref ApiAccessMode, test]
        AssertDescription: Subscription billing is test-mode only until production review is complete.
      - Assert: !Not [!Equals [!Ref StripeSecretKey, ""]]
        AssertDescription: Test subscription billing requires a Stripe secret key.
      - Assert: !Not [!Equals [!Ref StripeSubscriptionWebhookSecret, ""]]
        AssertDescription: Test subscription billing requires a signed webhook secret.
      - Assert: !Not [!Equals [!Ref StripeApiDeveloperPriceId, ""]]
        AssertDescription: Developer plan Stripe price ID is required.
      - Assert: !Not [!Equals [!Ref StripeApiProPriceId, ""]]
        AssertDescription: Pro plan Stripe price ID is required.
      - Assert: !Not [!Equals [!Ref StripeApiBusinessPriceId, ""]]
        AssertDescription: Business plan Stripe price ID is required.

Resources:
  ApiAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  ApiKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: keyId
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: keyId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AccountIdIndex
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  ApiUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: usageKey
          AttributeType: S
      KeySchema:
        - AttributeName: usageKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ApiUsageIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ApiSubscriptionEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ApiCustomerAuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: authKey
          AttributeType: S
      KeySchema:
        - AttributeName: authKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ApiAccessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteOrigin
        AllowCredentials: true
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders:
          - authorization
          - content-type
          - idempotency-key
          - x-solvelang-admin-secret
          - x-solvelang-csrf
          - stripe-signature
      Auth:
        Authorizers:
          SolveLangApiKeyAuthorizer:
            FunctionArn: !GetAtt ApiKeyAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 0

  ApiAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      Architectures: [arm64]
      Environment:
        Variables:
          API_ACCESS_ENABLED: !Ref ApiAccessEnabled
          API_ACCESS_MODE: !Ref ApiAccessMode
          API_CUSTOMER_ACCOUNTS_ENABLED: !Ref CustomerAccountsEnabled
          API_SUBSCRIPTION_BILLING_ENABLED: !Ref SubscriptionBillingEnabled
          API_KEY_PEPPER: !Ref ApiKeyPepper
          API_ACCESS_ADMIN_SECRET: !Ref ApiAccessAdminSecret
          API_CUSTOMER_AUTH_PEPPER: !Ref CustomerAuthPepper
          API_CUSTOMER_AUTH_EMAIL_SENDER: !Ref CustomerAuthEmailSender
          API_CUSTOMER_AUTH_EMAIL_REPLY_TO: !Ref CustomerAuthEmailReplyTo
          SITE_ORIGIN: !Ref SiteOrigin
          API_ACCOUNTS_TABLE: !Ref ApiAccountsTable
          API_KEYS_TABLE: !Ref ApiKeysTable
          API_KEYS_ACCOUNT_INDEX: AccountIdIndex
          API_USAGE_TABLE: !Ref ApiUsageTable
          API_USAGE_IDEMPOTENCY_TABLE: !Ref ApiUsageIdempotencyTable
          API_SUBSCRIPTION_EVENTS_TABLE: !Ref ApiSubscriptionEventsTable
          API_CUSTOMER_AUTH_TABLE: !Ref ApiCustomerAuthTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_SUBSCRIPTION_WEBHOOK_SECRET: !Ref StripeSubscriptionWebhookSecret
          STRIPE_API_DEVELOPER_PRICE_ID: !Ref StripeApiDeveloperPriceId
          STRIPE_API_PRO_PRICE_ID: !Ref StripeApiProPriceId
          STRIPE_API_BUSINESS_PRICE_ID: !Ref StripeApiBusinessPriceId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiUsageTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiUsageIdempotencyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiSubscriptionEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiCustomerAuthTable
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: '*'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /health
            Method: GET
        CustomerMagicLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/auth/magic-link
            Method: POST
        CustomerVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/auth/verify
            Method: POST
        CustomerPasswordLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/auth/password
            Method: POST
        CustomerLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/auth/logout
            Method: POST
        CustomerAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/account
            Method: GET
        CustomerCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/auth/credentials
            Method: POST
        CustomerIssueKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/keys
            Method: POST
        CustomerRevokeKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/keys/revoke
            Method: POST
        CustomerSubscriptionCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/subscriptions/checkout
            Method: POST
        CustomerSubscriptionPortal:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /customer/subscriptions/portal
            Method: POST
        SubscriptionCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /internal/subscriptions/checkout
            Method: POST
        SubscriptionWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /stripe/subscriptions/webhook
            Method: POST
        ProvisionSubscription:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /internal/subscriptions/provision
            Method: POST
        IssueKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /internal/keys
            Method: POST
        RevokeKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /internal/keys/revoke
            Method: POST
        ConsumeUsage:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /internal/usage/consume
            Method: POST
        WhoAmI:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiAccessHttpApi
            Path: /v1/whoami
            Method: GET
            Auth:
              Authorizer: SolveLangApiKeyAuthorizer

  ApiKeyAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/authorizer-handler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 5
      Architectures: [arm64]
      Environment:
        Variables:
          API_ACCESS_ENABLED: !Ref ApiAccessEnabled
          API_ACCESS_MODE: !Ref ApiAccessMode
          API_KEY_PEPPER: !Ref ApiKeyPepper
          API_ACCOUNTS_TABLE: !Ref ApiAccountsTable
          API_KEYS_TABLE: !Ref ApiKeysTable
          API_KEYS_ACCOUNT_INDEX: AccountIdIndex
          API_USAGE_TABLE: !Ref ApiUsageTable
          API_USAGE_IDEMPOTENCY_TABLE: !Ref ApiUsageIdempotencyTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ApiAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeysTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiUsageTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiUsageIdempotencyTable
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt ApiUsageTable.Arn
              - !GetAtt ApiUsageIdempotencyTable.Arn

  ApiKeyAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiKeyAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiAccessHttpApi}/authorizers/*

Outputs:
  ApiAccessBaseUrl:
    Value: !Sub https://${ApiAccessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiAccessEnabledState:
    Value: !Ref ApiAccessEnabled
  CustomerAccountsEnabledState:
    Value: !Ref CustomerAccountsEnabled
  SubscriptionBillingEnabledState:
    Value: !Ref SubscriptionBillingEnabled
  StripeSubscriptionWebhookUrl:
    Value: !Sub https://${ApiAccessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/stripe/subscriptions/webhook
