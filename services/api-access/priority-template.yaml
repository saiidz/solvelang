AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SolveLang test-only priority queue canary stack with isolated weighted worker capacity

Parameters:
  PriorityQueueEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  PriorityQueueMode:
    Type: String
    AllowedValues: [test]
    Default: test
  PriorityAdminSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  CustomerAuthTableName:
    Type: String
    Default: ""
    AllowedPattern: '^$|[A-Za-z0-9_.-]{3,255}$'
    Description: Optional CustomerAuthTable name used to verify customer-owned jobs before execution.

Conditions:
  PriorityQueueIsEnabled: !Equals [!Ref PriorityQueueEnabled, "true"]
  CustomerAccountVerificationConfigured: !Not [!Equals [!Ref CustomerAuthTableName, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: .
    Architectures: [arm64]
    Tracing: Active

Resources:
  PriorityJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  PriorityAdminHttpApi:
    Type: AWS::Serverless::HttpApi

  PriorityAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/priority-api-handler.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          API_PRIORITY_QUEUE_ENABLED: !Ref PriorityQueueEnabled
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_ADMIN_SECRET: !Ref PriorityAdminSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriorityAdminHttpApi
            Path: /health
            Method: GET
        SubmitCanary:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriorityAdminHttpApi
            Path: /internal/jobs/canary
            Method: POST
        JobStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriorityAdminHttpApi
            Path: /internal/jobs/{jobId}
            Method: GET

  PriorityDispatchFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-dispatch-failure
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StandardDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-standard-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ExpressDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-express-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  PriorityDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-priority-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CriticalDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-critical-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StandardQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-standard.fifo
      FifoQueue: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StandardDeadLetterQueue.Arn
        maxReceiveCount: 3

  ExpressQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-express.fifo
      FifoQueue: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExpressDeadLetterQueue.Arn
        maxReceiveCount: 3

  PriorityQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-priority.fifo
      FifoQueue: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PriorityDeadLetterQueue.Arn
        maxReceiveCount: 3

  CriticalQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-critical.fifo
      FifoQueue: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CriticalDeadLetterQueue.Arn
        maxReceiveCount: 3

  PriorityDispatcherFunction:
    Type: AWS::Serverless::Function
    Condition: PriorityQueueIsEnabled
    Properties:
      Handler: src/priority-dispatcher-handler.handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_STANDARD_QUEUE_URL: !Ref StandardQueue
          API_PRIORITY_EXPRESS_QUEUE_URL: !Ref ExpressQueue
          API_PRIORITY_PRIORITY_QUEUE_URL: !Ref PriorityQueue
          API_PRIORITY_CRITICAL_QUEUE_URL: !Ref CriticalQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt StandardQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExpressQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PriorityQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CriticalQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PriorityDispatchFailureQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:ListStreams
            Resource: !GetAtt PriorityJobsTable.StreamArn
      Events:
        JobStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PriorityJobsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt PriorityDispatchFailureQueue.Arn
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"status":{"S":["queued"]}}}}'

  StandardWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: PriorityQueueIsEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: standard
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - !If
          - CustomerAccountVerificationConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy:
            QueueName: !GetAtt StandardQueue.QueueName
      Events:
        StandardLane:
          Type: SQS
          Properties:
            Queue: !GetAtt StandardQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  ExpressWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: PriorityQueueIsEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: express
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - !If
          - CustomerAccountVerificationConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy:
            QueueName: !GetAtt ExpressQueue.QueueName
      Events:
        ExpressLane:
          Type: SQS
          Properties:
            Queue: !GetAtt ExpressQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2

  PriorityWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: PriorityQueueIsEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: priority
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - !If
          - CustomerAccountVerificationConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy:
            QueueName: !GetAtt PriorityQueue.QueueName
      Events:
        PriorityLane:
          Type: SQS
          Properties:
            Queue: !GetAtt PriorityQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5

  CriticalWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: PriorityQueueIsEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: critical
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - !If
          - CustomerAccountVerificationConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy:
            QueueName: !GetAtt CriticalQueue.QueueName
      Events:
        CriticalLane:
          Type: SQS
          Properties:
            Queue: !GetAtt CriticalQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 10

Outputs:
  PriorityAdminBaseUrl:
    Value: !Sub https://${PriorityAdminHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  PriorityQueueEnabledState:
    Value: !Ref PriorityQueueEnabled
  PriorityQueueModeState:
    Value: !Ref PriorityQueueMode
  PriorityJobsTableName:
    Value: !Ref PriorityJobsTable
  PriorityDispatchFailureQueueUrl:
    Value: !Ref PriorityDispatchFailureQueue
  StandardDeadLetterQueueUrl:
    Value: !Ref StandardDeadLetterQueue
  ExpressDeadLetterQueueUrl:
    Value: !Ref ExpressDeadLetterQueue
  PriorityDeadLetterQueueUrl:
    Value: !Ref PriorityDeadLetterQueue
  CriticalDeadLetterQueueUrl:
    Value: !Ref CriticalDeadLetterQueue
