AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SolveLang production priority queue candidate. All processing remains disabled by default.

Parameters:
  PriorityQueueEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  PriorityProviderExecutionEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  CustomerAuthTableName:
    Type: String
    Default: ""
    AllowedPattern: '^$|[A-Za-z0-9_.-]{3,255}$'
  PriorityProviderUrl:
    Type: String
    Default: ""
    AllowedPattern: '^$|https://[^ ]+$'
  PriorityProviderSecret:
    Type: String
    NoEcho: true
    Default: ""
    AllowedPattern: '^$|.{32,512}$'

Conditions:
  QueueEnabled: !Equals [!Ref PriorityQueueEnabled, "true"]
  ProviderEnabled: !Equals [!Ref PriorityProviderExecutionEnabled, "true"]
  CustomerVerificationConfigured: !Not [!Equals [!Ref CustomerAuthTableName, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: .
    Architectures: [arm64]
    Tracing: Active

Resources:
  PriorityJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PrioritySourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-customer-priority-sources
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DispatchFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StandardDlq:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  ExpressDlq:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PriorityDlq:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  CriticalDlq:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  StandardQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StandardDlq.Arn
        maxReceiveCount: 3
  ExpressQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExpressDlq.Arn
        maxReceiveCount: 3
  PriorityQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PriorityDlq.Arn
        maxReceiveCount: 3
  CriticalQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CriticalDlq.Arn
        maxReceiveCount: 3

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Condition: QueueEnabled
    Properties:
      Handler: src/priority-dispatcher-handler.handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_STANDARD_QUEUE_URL: !Ref StandardQueue
          API_PRIORITY_EXPRESS_QUEUE_URL: !Ref ExpressQueue
          API_PRIORITY_PRIORITY_QUEUE_URL: !Ref PriorityQueue
          API_PRIORITY_CRITICAL_QUEUE_URL: !Ref CriticalQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriorityJobsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt StandardQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExpressQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PriorityQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CriticalQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DispatchFailureQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:ListStreams
            Resource: !GetAtt PriorityJobsTable.StreamArn
      Events:
        JobStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PriorityJobsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt DispatchFailureQueue.Arn
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"status":{"S":["queued"]}}}}'

  StandardWorker:
    Type: AWS::Serverless::Function
    Condition: QueueEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: standard
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
          API_PRIORITY_PROVIDER_EXECUTION_ENABLED: !Ref PriorityProviderExecutionEnabled
          API_PRIORITY_SOURCE_BUCKET: !Ref PrioritySourceBucket
          API_PRIORITY_PROVIDER_URL: !Ref PriorityProviderUrl
          API_PRIORITY_PROVIDER_SECRET: !Ref PriorityProviderSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PriorityJobsTable }
        - S3ReadPolicy: { BucketName: !Ref PrioritySourceBucket }
        - !If
          - CustomerVerificationConfigured
          - Statement:
              Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy: { QueueName: !GetAtt StandardQueue.QueueName }
      Events:
        Lane:
          Type: SQS
          Properties:
            Queue: !GetAtt StandardQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  ExpressWorker:
    Type: AWS::Serverless::Function
    Condition: QueueEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: express
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
          API_PRIORITY_PROVIDER_EXECUTION_ENABLED: !Ref PriorityProviderExecutionEnabled
          API_PRIORITY_SOURCE_BUCKET: !Ref PrioritySourceBucket
          API_PRIORITY_PROVIDER_URL: !Ref PriorityProviderUrl
          API_PRIORITY_PROVIDER_SECRET: !Ref PriorityProviderSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PriorityJobsTable }
        - S3ReadPolicy: { BucketName: !Ref PrioritySourceBucket }
        - !If
          - CustomerVerificationConfigured
          - Statement:
              Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy: { QueueName: !GetAtt ExpressQueue.QueueName }
      Events:
        Lane:
          Type: SQS
          Properties:
            Queue: !GetAtt ExpressQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }

  PriorityWorker:
    Type: AWS::Serverless::Function
    Condition: QueueEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: priority
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
          API_PRIORITY_PROVIDER_EXECUTION_ENABLED: !Ref PriorityProviderExecutionEnabled
          API_PRIORITY_SOURCE_BUCKET: !Ref PrioritySourceBucket
          API_PRIORITY_PROVIDER_URL: !Ref PriorityProviderUrl
          API_PRIORITY_PROVIDER_SECRET: !Ref PriorityProviderSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PriorityJobsTable }
        - S3ReadPolicy: { BucketName: !Ref PrioritySourceBucket }
        - !If
          - CustomerVerificationConfigured
          - Statement:
              Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy: { QueueName: !GetAtt PriorityQueue.QueueName }
      Events:
        Lane:
          Type: SQS
          Properties:
            Queue: !GetAtt PriorityQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 5 }

  CriticalWorker:
    Type: AWS::Serverless::Function
    Condition: QueueEnabled
    Properties:
      Handler: src/priority-worker-handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          API_PRIORITY_JOBS_TABLE: !Ref PriorityJobsTable
          API_PRIORITY_LANE: critical
          API_CUSTOMER_AUTH_TABLE: !Ref CustomerAuthTableName
          API_PRIORITY_PROVIDER_EXECUTION_ENABLED: !Ref PriorityProviderExecutionEnabled
          API_PRIORITY_SOURCE_BUCKET: !Ref PrioritySourceBucket
          API_PRIORITY_PROVIDER_URL: !Ref PriorityProviderUrl
          API_PRIORITY_PROVIDER_SECRET: !Ref PriorityProviderSecret
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PriorityJobsTable }
        - S3ReadPolicy: { BucketName: !Ref PrioritySourceBucket }
        - !If
          - CustomerVerificationConfigured
          - Statement:
              Effect: Allow
              Action: [dynamodb:GetItem]
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomerAuthTableName}
          - !Ref AWS::NoValue
        - SQSPollerPolicy: { QueueName: !GetAtt CriticalQueue.QueueName }
      Events:
        Lane:
          Type: SQS
          Properties:
            Queue: !GetAtt CriticalQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 10 }

Outputs:
  PriorityQueueEnabledState:
    Value: !Ref PriorityQueueEnabled
  PriorityProviderExecutionEnabledState:
    Value: !Ref PriorityProviderExecutionEnabled
  PriorityJobsTableName:
    Value: !Ref PriorityJobsTable
  PrioritySourceBucketName:
    Value: !Ref PrioritySourceBucket
  StandardQueueUrl:
    Value: !Ref StandardQueue
  ExpressQueueUrl:
    Value: !Ref ExpressQueue
  PriorityQueueUrl:
    Value: !Ref PriorityQueue
  CriticalQueueUrl:
    Value: !Ref CriticalQueue
