AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SolveLang Stripe payment and signed entitlement service

Parameters:
  EntitlementMode:
    Type: String
    AllowedValues:
      - test
      - production
  CheckoutEnabled:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  WebhookSignedDeliveryVerified:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  LegalCheckoutReviewVerified:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  LegalIdentityVerified:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
  DurableConfirmationProvider:
    Type: String
    AllowedValues:
      - disabled
      - approved
    Default: disabled
  SiteOrigin:
    Type: String
    Default: https://www.solve-lang.com
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  TurnstileSecretKey:
    Type: String
    NoEcho: true
  EntitlementSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32

Rules:
  ProductionCheckoutRequiresVerifiedWebhook:
    RuleCondition: !Equals [!Ref EntitlementMode, production]
    Assertions:
      - Assert: !Or
          - !Equals [!Ref CheckoutEnabled, "false"]
          - !Equals [!Ref WebhookSignedDeliveryVerified, "true"]
        AssertDescription: Production checkout requires a verified Stripe-signed webhook delivery.
      - Assert: !Or
          - !Equals [!Ref CheckoutEnabled, "false"]
          - !Equals [!Ref LegalCheckoutReviewVerified, "true"]
        AssertDescription: Production checkout requires verified legal review and clickwrap readiness.
      - Assert: !Or
          - !Equals [!Ref CheckoutEnabled, "false"]
          - !Equals [!Ref LegalIdentityVerified, "true"]
        AssertDescription: Production checkout requires verified operator identity and final consumer price information.
      - Assert: !Or
          - !Equals [!Ref CheckoutEnabled, "false"]
          - !Equals [!Ref DurableConfirmationProvider, approved]
        AssertDescription: Production checkout requires an approved durable contract-confirmation provider.

Resources:
  EntitlementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scanId
          AttributeType: S
      KeySchema:
        - AttributeName: scanId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  EntitlementApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref SiteOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - stripe-signature

  EntitlementFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: false
        Format: cjs
    Properties:
      Runtime: nodejs22.x
      Handler: src/handler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      Architectures:
        - arm64
      Environment:
        Variables:
          SITE_ORIGIN: !Ref SiteOrigin
          ENTITLEMENT_MODE: !Ref EntitlementMode
          CHECKOUT_ENABLED: !Ref CheckoutEnabled
          DURABLE_CONFIRMATION_PROVIDER: !Ref DurableConfirmationProvider
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          ENTITLEMENT_SIGNING_SECRET: !Ref EntitlementSigningSecret
          ENTITLEMENTS_TABLE: !Ref EntitlementsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EntitlementsTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /health
            Method: GET
        Checkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /checkout
            Method: POST
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /webhook
            Method: POST
        Entitlement:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /entitlement
            Method: POST
        Withdraw:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /withdraw
            Method: POST
        Events:
          Type: HttpApi
          Properties:
            ApiId: !Ref EntitlementApi
            Path: /events
            Method: POST

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${EntitlementApi}.execute-api.${AWS::Region}.amazonaws.com
  WebhookUrl:
    Value: !Sub https://${EntitlementApi}.execute-api.${AWS::Region}.amazonaws.com/webhook
