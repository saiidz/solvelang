version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - rm -f .env.production
            - npm run test:studio-acceptance-build
        build:
          commands:
            - npm run build:studio-acceptance
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=63072000; includeSubDomains'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'Content-Security-Policy'
            value: 'default-src ''self''; script-src ''self'' ''unsafe-inline'' ''wasm-unsafe-eval'' https://js.stripe.com https://challenges.cloudflare.com; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:; font-src ''self'' data:; connect-src ''self'' https://3l3y008e94.execute-api.us-east-2.amazonaws.com https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com; frame-ancestors ''none''; base-uri ''self''; form-action ''self'''
