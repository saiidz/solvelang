name: Branch fix3 LSP 753

on:
  push:
    branches:
      - feature/lsp-open-module-navigation-20260901

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsp-open-module-navigation-20260901
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply iterator lint fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solvec/src/bin/solvelsp.rs')
          s = p.read_text()
          old = "                for candidate in left_paren + 1..right_paren {\n                    if matches!(&tokens[candidate].token, lexer::Token::Identifier(_)) {\n                        indexes.insert(candidate);\n                    }\n                }"
          new = "                for (candidate, token) in tokens.iter().enumerate().take(right_paren).skip(left_paren + 1) {\n                    if matches!(&token.token, lexer::Token::Identifier(_)) {\n                        indexes.insert(candidate);\n                    }\n                }"
          if old not in s:
              raise SystemExit('expected range loop not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --manifest-path solvec/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solvec/src/bin/solvelsp.rs
          git commit -m 'fix(lsp): satisfy iterator lint'
          git push origin HEAD:feature/lsp-open-module-navigation-20260901
