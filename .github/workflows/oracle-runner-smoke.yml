name: Oracle ARM64 Runner Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/oracle-runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Oracle ARM64 smoke
    runs-on: [self-hosted, Linux, ARM64, oracle-free, solvelang-ci]
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify Oracle ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"
          command -v git >/dev/null
          command -v shellcheck >/dev/null
          command -v docker >/dev/null
          docker info >/dev/null
          docker run --rm hello-world >/dev/null
          printf 'SOLVELANG_ORACLE_RUNNER_SMOKE=PASS arch=%s node=%s npm=%s\n' \
            "$(uname -m)" "$(node --version)" "$(npm --version)"
