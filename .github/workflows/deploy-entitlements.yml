name: Deploy Entitlements

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing protected secrets
        required: true
        default: entitlement-test
        type: choice
        options:
          - entitlement-test
          - entitlement-production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENTITLEMENT_MODE: ${{ inputs.environment == 'entitlement-production' && 'production' || 'test' }}
    defaults:
      run:
        working-directory: services/entitlements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      - run: npm install
      - name: Add local build tools to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: sam validate --lint --template template.yaml
      - run: sam build --template template.yaml
      - name: Prepare dedicated SAM artifact bucket
        id: artifact-bucket
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="solvelang-entitlements-artifacts-${account_id}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi

            aws s3api put-public-access-block \
              --bucket "$bucket" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-encryption \
              --bucket "$bucket" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            aws s3api put-bucket-versioning \
              --bucket "$bucket" \
              --versioning-configuration Status=Enabled
          fi

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
      - name: Deploy stack
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ENTITLEMENT_SIGNING_SECRET: ${{ secrets.ENTITLEMENT_SIGNING_SECRET }}
          CHECKOUT_ENABLED: ${{ inputs.environment == 'entitlement-test' && 'true' || vars.CHECKOUT_ENABLED || 'false' }}
          WEBHOOK_SIGNED_DELIVERY_VERIFIED: ${{ inputs.environment == 'entitlement-test' && 'true' || vars.WEBHOOK_SIGNED_DELIVERY_VERIFIED || 'false' }}
          LEGAL_CHECKOUT_REVIEW_VERIFIED: ${{ inputs.environment == 'entitlement-test' && 'true' || vars.LEGAL_CHECKOUT_REVIEW_VERIFIED || 'false' }}
          LEGAL_IDENTITY_VERIFIED: ${{ vars.LEGAL_IDENTITY_VERIFIED || 'false' }}
          DURABLE_CONFIRMATION_PROVIDER: ${{ inputs.environment == 'entitlement-test' && 'test-sink' || vars.DURABLE_CONFIRMATION_PROVIDER || 'disabled' }}
          DURABLE_CONFIRMATION_SENDER: ${{ vars.DURABLE_CONFIRMATION_SENDER || '' }}
          STACK_NAME: ${{ vars.ENTITLEMENT_STACK_NAME }}
          SAM_ARTIFACT_BUCKET: ${{ steps.artifact-bucket.outputs.bucket }}
        run: |
          set -euo pipefail
          test -n "$SITE_ORIGIN"
          test -n "$ENTITLEMENT_MODE"
          test -n "$STRIPE_SECRET_KEY"
          test -n "$STRIPE_WEBHOOK_SECRET"
          test -n "$TURNSTILE_SECRET_KEY"
          test -n "$ENTITLEMENT_SIGNING_SECRET"
          test -n "$STACK_NAME"
          test -n "$SAM_ARTIFACT_BUCKET"
          case "$ENTITLEMENT_MODE" in
            test)
              [[ "$STRIPE_SECRET_KEY" == sk_test_* ]] || { echo "Stripe key mode does not match entitlement-test." >&2; exit 1; }
              [[ "$STACK_NAME" == *test* ]] || { echo "Test stack name must identify the test environment." >&2; exit 1; }
              [[ "$CHECKOUT_ENABLED" == "true" ]] || { echo "Test checkout must remain enabled." >&2; exit 1; }
              ;;
            production)
              [[ "$STRIPE_SECRET_KEY" == sk_live_* ]] || { echo "Stripe key mode does not match entitlement-production." >&2; exit 1; }
              [[ "$STACK_NAME" == *production* ]] || { echo "Production stack name must identify the production environment." >&2; exit 1; }
              [[ "$CHECKOUT_ENABLED" == "true" || "$CHECKOUT_ENABLED" == "false" ]] || { echo "CHECKOUT_ENABLED must be true or false." >&2; exit 1; }
              [[ "$WEBHOOK_SIGNED_DELIVERY_VERIFIED" == "true" || "$WEBHOOK_SIGNED_DELIVERY_VERIFIED" == "false" ]] || { echo "WEBHOOK_SIGNED_DELIVERY_VERIFIED must be true or false." >&2; exit 1; }
              [[ "$LEGAL_CHECKOUT_REVIEW_VERIFIED" == "true" || "$LEGAL_CHECKOUT_REVIEW_VERIFIED" == "false" ]] || { echo "LEGAL_CHECKOUT_REVIEW_VERIFIED must be true or false." >&2; exit 1; }
              [[ "$LEGAL_IDENTITY_VERIFIED" == "true" || "$LEGAL_IDENTITY_VERIFIED" == "false" ]] || { echo "LEGAL_IDENTITY_VERIFIED must be true or false." >&2; exit 1; }
              [[ "$DURABLE_CONFIRMATION_PROVIDER" == "disabled" || "$DURABLE_CONFIRMATION_PROVIDER" == "test-sink" || "$DURABLE_CONFIRMATION_PROVIDER" == "aws-ses-sqs" ]] || { echo "DURABLE_CONFIRMATION_PROVIDER must be disabled, test-sink, or aws-ses-sqs." >&2; exit 1; }
              if [[ "$CHECKOUT_ENABLED" == "true" && ( "$WEBHOOK_SIGNED_DELIVERY_VERIFIED" != "true" || "$LEGAL_CHECKOUT_REVIEW_VERIFIED" != "true" || "$LEGAL_IDENTITY_VERIFIED" != "true" || "$DURABLE_CONFIRMATION_PROVIDER" != "aws-ses-sqs" ) ]]; then
                echo "Production checkout requires verified webhook, legal review, legal identity, and durable confirmation controls." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported entitlement mode." >&2
              exit 1
              ;;
          esac
          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --s3-prefix "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EntitlementMode="$ENTITLEMENT_MODE" \
              CheckoutEnabled="$CHECKOUT_ENABLED" \
              WebhookSignedDeliveryVerified="$WEBHOOK_SIGNED_DELIVERY_VERIFIED" \
              LegalCheckoutReviewVerified="$LEGAL_CHECKOUT_REVIEW_VERIFIED" \
              LegalIdentityVerified="$LEGAL_IDENTITY_VERIFIED" \
              DurableConfirmationProvider="$DURABLE_CONFIRMATION_PROVIDER" \
              DurableConfirmationSender="$DURABLE_CONFIRMATION_SENDER" \
              SiteOrigin="$SITE_ORIGIN" \
              StripeSecretKey="$STRIPE_SECRET_KEY" \
              StripeWebhookSecret="$STRIPE_WEBHOOK_SECRET" \
              TurnstileSecretKey="$TURNSTILE_SECRET_KEY" \
              EntitlementSigningSecret="$ENTITLEMENT_SIGNING_SECRET"
      - name: Print non-secret outputs
        env:
          STACK_NAME: ${{ vars.ENTITLEMENT_STACK_NAME }}
        run: aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output table
