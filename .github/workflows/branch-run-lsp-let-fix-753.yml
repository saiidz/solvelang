name: Branch run LSP let fix 753

on:
  push:
    branches:
      - feature/lsp-open-module-navigation-20260901

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsp-open-module-navigation-20260901
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged fix
        run: |
          python3 .github/scripts/fix_lsp_753_let.py
          cargo fmt --manifest-path solvec/Cargo.toml
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solvec/src/bin/solvelsp.rs
          git commit -m 'fix(lsp): activate let shadows after initializer'
          git push origin HEAD:feature/lsp-open-module-navigation-20260901
