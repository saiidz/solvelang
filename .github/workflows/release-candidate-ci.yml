name: Release Candidate CI

on:
  pull_request:
    paths:
      - "solvec/**"
      - "solvec-core/**"
      - ".github/workflows/release-candidate-ci.yml"
      - "docs/release-contract.md"
      - "docs/release-candidate-dry-run.md"
      - "CHANGELOG.md"
      - "SPEC.md"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional Cargo package version expected from the selected ref"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64 dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET: x86_64-unknown-linux-gnu
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ env.TARGET }}

      - name: Verify exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Check solvec-core formatting
        working-directory: solvec-core
        run: cargo fmt --check

      - name: Run solvec-core clippy
        working-directory: solvec-core
        run: cargo clippy --target "$TARGET" -- -D warnings

      - name: Run solvec-core tests
        working-directory: solvec-core
        run: cargo test --target "$TARGET"

      - name: Check formatting
        working-directory: solvec
        run: cargo fmt --check

      - name: Run clippy
        working-directory: solvec
        run: cargo clippy --locked --target "$TARGET" -- -D warnings

      - name: Run tests
        working-directory: solvec
        run: cargo test --locked --target "$TARGET"

      - name: Build and verify candidate twice
        env:
          SOLVELANG_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          SOLVELANG_RELEASE_TARGET: ${{ env.TARGET }}
        run: |
          set -Eeuo pipefail
          first="$RUNNER_TEMP/release-candidate-first"
          second="$RUNNER_TEMP/release-candidate-second"

          SOLVELANG_RELEASE_DIST="$first" ./solvec/scripts/build-release-candidate.sh
          ./solvec/scripts/verify-release-candidate.sh "$first" "$SOURCE_SHA"

          SOLVELANG_RELEASE_DIST="$second" ./solvec/scripts/build-release-candidate.sh
          ./solvec/scripts/verify-release-candidate.sh "$second" "$SOURCE_SHA"

          diff -qr "$first" "$second"
          artifact="$(python3 - "$first/provenance.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["artifact"])
          PY
          )"
          cmp "$first/$artifact" "$second/$artifact"
          cmp "$first/SHA256SUMS" "$second/SHA256SUMS"
          cmp "$first/provenance.json" "$second/provenance.json"

          python3 - "$first/provenance.json" "$SOURCE_SHA" "$EXPECTED_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          provenance = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_sha = sys.argv[2]
          expected_version = sys.argv[3]
          assert provenance["publishable"] is False
          assert provenance["source_commit"] == expected_sha
          assert provenance["target"] == "x86_64-unknown-linux-gnu"
          assert provenance["os"] == "linux"
          assert provenance["arch"] == "x86_64"
          assert provenance["workflow"]["repository"] == "saiidz/solvelang"
          assert provenance["workflow"]["run_id"]
          assert provenance["workflow"]["run_attempt"]
          if expected_version:
              assert provenance["version"] == expected_version, (
                  f"expected version {expected_version}, got {provenance['version']}"
              )
          PY

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solvelang-release-candidate-linux-x86_64-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/release-candidate-first/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
