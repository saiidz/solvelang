name: Branch fix2 LSP 753

on:
  push:
    branches:
      - feature/lsp-open-module-navigation-20260901

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsp-open-module-navigation-20260901
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix comparison and unused field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('solvec/src/bin/solvelsp.rs')
          text = path.read_text()
          text = text.replace(
              'lexer::Token::Identifier(ref candidate) if candidate == name => {',
              'lexer::Token::Identifier(ref candidate) if candidate == &name => {',
              1,
          )
          text = text.replace(
              'struct NamespaceImport {\n    path: String,\n    namespace: String,\n}',
              'struct NamespaceImport {\n    path: String,\n}',
              1,
          )
          text = text.replace(
              'Some(NamespaceImport {\n                path,\n                namespace: declared,\n            })',
              'Some(NamespaceImport { path })',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --manifest-path solvec/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solvec/src/bin/solvelsp.rs
          git commit -m 'fix(lsp): complete borrowed highlight match'
          git push origin HEAD:feature/lsp-open-module-navigation-20260901
