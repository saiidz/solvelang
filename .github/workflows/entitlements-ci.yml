name: Entitlements CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/entitlements/**'
      - '.github/workflows/entitlements-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'services/entitlements/**'
      - '.github/workflows/entitlements-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/entitlements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/entitlements/package.json
      - run: npm install --ignore-scripts
      - run: npm test
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template template.yaml
      - run: sam build --template template.yaml
