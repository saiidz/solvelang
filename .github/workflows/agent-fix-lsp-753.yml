name: Agent Fix LSP 753

on:
  push:
    branches:
      - feature/lsp-open-module-navigation-20260901
    paths:
      - .github/workflows/agent-fix-lsp-753.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsp-open-module-navigation-20260901
          fetch-depth: 1
      - name: Apply exact lexical-shadow fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('solvec/src/bin/solvelsp.rs')
          text = path.read_text()

          definition_old = '''        return export_location(&target_uri, target_text, &export);\n    }\n\n    let Some((location, kind)) = top_level_symbol(text, &name) else {\n'''
          definition_new = '''        return export_location(&target_uri, target_text, &export);\n    }\n\n    if namespace_import(text, &name).is_some()\n        && active_lexical_shadow(text, &name, line, character)\n    {\n        return Value::Null;\n    }\n\n    let Some((location, kind)) = top_level_symbol(text, &name) else {\n'''

          hover_old = '''        return imported_hover(&import.local, &target_uri, &export);\n    }\n\n    let Some((_, kind)) = top_level_symbol(text, &name) else {\n'''
          hover_new = '''        return imported_hover(&import.local, &target_uri, &export);\n    }\n\n    if namespace_import(text, &name).is_some()\n        && active_lexical_shadow(text, &name, line, character)\n    {\n        return Value::Null;\n    }\n\n    let Some((_, kind)) = top_level_symbol(text, &name) else {\n'''

          if text.count(definition_old) != 1:
              raise SystemExit('definition anchor mismatch')
          if text.count(hover_old) != 1:
              raise SystemExit('hover anchor mismatch')

          text = text.replace(definition_old, definition_new, 1)
          text = text.replace(hover_old, hover_new, 1)
          path.write_text(text)
          PY
          git diff --check
          grep -n -A7 -B2 'namespace_import(text, &name).is_some()' solvec/src/bin/solvelsp.rs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'solve-build-loop'
          git config user.email 'actions@users.noreply.github.com'
          git add solvec/src/bin/solvelsp.rs
          git diff --cached --check
          git commit -m 'fix(lsp): respect namespace shadow activation'
          git push origin HEAD:feature/lsp-open-module-navigation-20260901
