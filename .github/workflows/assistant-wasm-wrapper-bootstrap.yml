name: Assistant WASM wrapper bootstrap

on:
  push:
    branches:
      - feat/issue-774-wasm-deny-all-wrapper
    paths:
      - .github/workflows/assistant-wasm-wrapper-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-774-wasm-deny-all-wrapper
          fetch-depth: 0

      - name: Set up Rust with browser target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Generate reviewed lockfile and validate wrapper
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path solvec-wasm/Cargo.toml
          cargo fmt --manifest-path solvec-wasm/Cargo.toml
          cargo clippy --manifest-path solvec-wasm/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path solvec-wasm/Cargo.toml --locked
          cargo build --release --locked --target wasm32-unknown-unknown --manifest-path solvec-wasm/Cargo.toml
          git diff --check

      - name: Commit lockfile and formatted sources
        shell: bash
        run: |
          git rm .github/workflows/assistant-wasm-wrapper-bootstrap.yml
          git add solvec-wasm/Cargo.toml solvec-wasm/Cargo.lock solvec-wasm/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(wasm): lock deny-all wrapper dependencies"
          git push origin HEAD:feat/issue-774-wasm-deny-all-wrapper
