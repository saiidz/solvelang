name: API Access CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/api-access/**'
      - 'ops/aws/customer-totp-kms-template.yaml'
      - 'ops/aws/production-preflight-policy.json'
      - 'ops/aws/production-foundation-deploy-policy.json'
      - 'ops/aws/production-totp-preflight-supplemental-policy.json'
      - 'ops/aws/production-totp-deploy-supplemental-policy.json'
      - 'ops/aws/verify-production-totp-role-supplements.sh'
      - '.github/workflows/api-access-ci.yml'
      - '.github/workflows/account-access-production-admin.yml'
      - '.github/workflows/deploy-priority-queue.yml'
      - '.github/workflows/deploy-api-access-production-customer-accounts.yml'
      - '.github/workflows/deploy-api-access-production-totp-kms.yml'
      - '.github/workflows/deploy-api-access-production-totp.yml'
      - '.github/workflows/preflight-api-access-production-totp.yml'
  push:
    branches:
      - main
    paths:
      - 'services/api-access/**'
      - 'ops/aws/customer-totp-kms-template.yaml'
      - 'ops/aws/production-preflight-policy.json'
      - 'ops/aws/production-foundation-deploy-policy.json'
      - 'ops/aws/production-totp-preflight-supplemental-policy.json'
      - 'ops/aws/production-totp-deploy-supplemental-policy.json'
      - 'ops/aws/verify-production-totp-role-supplements.sh'
      - '.github/workflows/api-access-ci.yml'
      - '.github/workflows/account-access-production-admin.yml'
      - '.github/workflows/deploy-priority-queue.yml'
      - '.github/workflows/deploy-api-access-production-customer-accounts.yml'
      - '.github/workflows/deploy-api-access-production-totp-kms.yml'
      - '.github/workflows/deploy-api-access-production-totp.yml'
      - '.github/workflows/preflight-api-access-production-totp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run API access and priority queue tests
        run: npm test
      - uses: aws-actions/setup-sam@v2
      - name: Validate API access SAM template
        run: sam validate --lint --template template.yaml
      - name: Build API access stack
        run: sam build --template template.yaml --build-dir .aws-sam/api-access
      - name: Validate priority queue SAM template
        run: sam validate --lint --template priority-template.yaml
      - name: Build priority queue stack
        run: sam build --template priority-template.yaml --build-dir .aws-sam/priority-queue
      - name: Install pinned CloudFormation linter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cfn-lint-venv"
          "$RUNNER_TEMP/cfn-lint-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'cfn-lint==1.52.1'
      - name: Lint dedicated TOTP KMS CloudFormation template
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cfn-lint-venv/bin/cfn-lint" ../../ops/aws/customer-totp-kms-template.yaml
      - name: Parse production IAM policy contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const path of [
            '../../ops/aws/production-preflight-policy.json',
            '../../ops/aws/production-foundation-deploy-policy.json',
            '../../ops/aws/production-totp-preflight-supplemental-policy.json',
            '../../ops/aws/production-totp-deploy-supplemental-policy.json',
          ]) JSON.parse(fs.readFileSync(path, 'utf8'));
          NODE
      - name: Syntax-check read-only TOTP IAM verifier
        run: bash -n ../../ops/aws/verify-production-totp-role-supplements.sh
