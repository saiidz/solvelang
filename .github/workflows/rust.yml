name: Rust

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solvec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvec
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Resolve RustSec cache window
        id: rustsec-cache
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore RustSec audit tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-audit-${{ steps.rustsec-cache.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Validate host-incapable solvec-core boundary
        working-directory: solvec-core
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
