name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvec
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Set up Node for WASM conformance
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check solvec-core formatting
        working-directory: solvec-core
        run: cargo fmt --check

      - name: Run solvec-core clippy
        working-directory: solvec-core
        run: cargo clippy -- -D warnings

      - name: Run solvec-core tests
        working-directory: solvec-core
        run: cargo test

      - name: Check solvec-wasm formatting
        working-directory: solvec-wasm
        run: cargo fmt --check

      - name: Run solvec-wasm clippy
        working-directory: solvec-wasm
        run: cargo clippy --all-targets -- -D warnings

      - name: Run solvec-wasm tests
        working-directory: solvec-wasm
        run: cargo test --locked

      - name: Build deny-all WASM wrapper
        working-directory: solvec-wasm
        run: cargo build --release --locked --target wasm32-unknown-unknown

      - name: Restore matching wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.127

      - name: Install matching wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Verify matching wasm-bindgen CLI
        run: test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.127"

      - name: Execute compiled WASM conformance
        working-directory: .
        run: |
          rm -rf solvec-wasm/target/conformance-bindings
          wasm-bindgen \
            --target nodejs \
            --no-typescript \
            --out-dir solvec-wasm/target/conformance-bindings \
            solvec-wasm/target/wasm32-unknown-unknown/release/solvec_wasm.wasm
          node solvec-wasm/qa/wasm-conformance.cjs \
            solvec-wasm/target/conformance-bindings/solvec_wasm.js \
            conformance/browser-preview-v1.json

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  site:
    name: Static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject draft locale preview in CI
        run: test "${I18N_DRAFT_PREVIEW:-false}" = "false"

      - name: Run deterministic Studio and preflight tests
        run: npm run test:studio

      - name: Verify static browser runtime package
        run: node --test qa/wasm-preview-package.test.mjs

      - name: Run lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Verify exported document languages
        run: npm run verify:i18n-export

      - name: Check static export output
        run: |
          test -f out/index.html
          test -f out/run/index.html
          test -f out/pricing/index.html
          test -f out/check/index.html
          test -f out/sitemap.xml
          test "$(find out -mindepth 1 -maxdepth 1 -type d \( -name fr -o -name ro -o -name ar -o -name he \) | wc -l)" -eq 0
          grep -q '<html lang="en" dir="ltr"' out/index.html
          test ! -d app/api
