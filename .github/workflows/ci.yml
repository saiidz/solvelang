name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvec
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  site:
    name: Static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject draft locale preview in CI
        run: test "${I18N_DRAFT_PREVIEW:-false}" = "false"

      - name: Run deterministic Studio and preflight tests
        run: npm run test:studio

      - name: Run lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Verify exported document languages
        run: npm run verify:i18n-export

      - name: Check static export output
        run: |
          test -f out/index.html
          test -f out/run/index.html
          test -f out/pricing/index.html
          test -f out/check/index.html
          test -f out/sitemap.xml
          test "$(find out -mindepth 1 -maxdepth 1 -type d \( -name fr -o -name ro -o -name ar -o -name he \) | wc -l)" -eq 0
          grep -q '<html lang="en" dir="ltr"' out/index.html
          test ! -d app/api
