name: Deploy API Access Production TOTP

on:
  workflow_dispatch:
    inputs:
      confirm_production_totp:
        description: Confirm enabling optional authenticator-app 2FA for production customer accounts
        required: true
        default: false
        type: boolean
      confirm_billing_remains_disabled:
        description: Confirm subscription billing, Stripe, webhooks, and charges must remain disabled
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: api-access-production
    defaults:
      run:
        working-directory: services/api-access
    env:
      API_ACCESS_MODE: live
      API_ACCESS_ENABLED: "true"
      CUSTOMER_ACCOUNTS_ENABLED: "true"
      CUSTOMER_TOTP_ENABLED: "true"
      SUBSCRIPTION_BILLING_ENABLED: "false"
      DISABLED_TOTP_KMS_ARN: arn:aws:kms:us-east-1:000000000000:key/disabled
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.API_ACCESS_STACK_NAME }}
      KMS_STACK_NAME: solvelang-api-access-production-totp-kms
      KMS_ALIAS: alias/solvelang-customer-totp-production
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      CUSTOMER_AUTH_EMAIL_SENDER: ${{ vars.CUSTOMER_AUTH_EMAIL_SENDER }}
      CUSTOMER_AUTH_EMAIL_REPLY_TO: ${{ vars.CUSTOMER_AUTH_EMAIL_REPLY_TO }}
      OPERATIONS_ALARM_TOPIC_ARN: ${{ vars.OPERATIONS_ALARM_TOPIC_ARN }}
      API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
      API_ACCESS_ADMIN_SECRET: ${{ secrets.API_ACCESS_ADMIN_SECRET }}
      CUSTOMER_AUTH_PEPPER: ${{ secrets.CUSTOMER_AUTH_PEPPER }}

    steps:
      - uses: actions/checkout@v4

      - name: Enforce production authenticator deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production authenticator deployment must run from main." >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Checked-out commit does not match GITHUB_SHA." >&2; exit 1; }
          [[ "${{ inputs.confirm_production_totp }}" == "true" ]] || { echo "Explicit production authenticator confirmation is required." >&2; exit 1; }
          [[ "${{ inputs.confirm_billing_remains_disabled }}" == "true" ]] || { echo "Explicit billing-disabled confirmation is required." >&2; exit 1; }
          [[ "$API_ACCESS_MODE" == live ]]
          [[ "$API_ACCESS_ENABLED" == true ]]
          [[ "$CUSTOMER_ACCOUNTS_ENABLED" == true ]]
          [[ "$CUSTOMER_TOTP_ENABLED" == true ]]
          [[ "$SUBSCRIPTION_BILLING_ENABLED" == false ]]
          [[ "$STACK_NAME" == *prod* || "$STACK_NAME" == *production* ]] || { echo "Production stack name must contain prod or production." >&2; exit 1; }
          [[ "$STACK_NAME" != *test* ]]
          [[ "$KMS_STACK_NAME" == "solvelang-api-access-production-totp-kms" ]]
          [[ "$KMS_ALIAS" == "alias/solvelang-customer-totp-production" ]]
          [[ "$SITE_ORIGIN" == https://* ]]
          [[ "$OPERATIONS_ALARM_TOPIC_ARN" == arn:aws:sns:${AWS_REGION}:*:* ]] || { echo "OPERATIONS_ALARM_TOPIC_ARN must be a same-region SNS topic." >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for earlier production deployment requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deployment-turn.mjs

      - name: Assume production preflight role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Validate independent production auth secrets
        shell: bash
        run: |
          set -euo pipefail
          require_length() { (( ${#2} >= $3 )) || { echo "$1 must contain at least $3 characters." >&2; exit 1; }; }
          require_length API_KEY_PEPPER "$API_KEY_PEPPER" 32
          require_length API_ACCESS_ADMIN_SECRET "$API_ACCESS_ADMIN_SECRET" 32
          require_length CUSTOMER_AUTH_PEPPER "$CUSTOMER_AUTH_PEPPER" 32
          [[ "$API_KEY_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_KEY_PEPPER" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          test -n "$CUSTOMER_AUTH_EMAIL_SENDER"

      - name: Verify dedicated TOTP KMS stack and key
        id: kms
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$KMS_STACK_NAME" --output json)"
          status="$(jq -r '.Stacks[0].StackStatus // empty' <<<"$stack")"
          [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE ]] || { echo "Production TOTP KMS stack is not stable: $status" >&2; exit 1; }
          key_arn="$(jq -r '[.Stacks[0].Outputs[]? | select(.OutputKey == "CustomerTotpKmsKeyArn") | .OutputValue] | first // empty' <<<"$stack")"
          alias_name="$(jq -r '[.Stacks[0].Outputs[]? | select(.OutputKey == "CustomerTotpKmsAlias") | .OutputValue] | first // empty' <<<"$stack")"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$key_arn" == "arn:aws:kms:${AWS_REGION}:${account_id}:key/"* ]] || { echo "TOTP KMS key is outside the production account or region." >&2; exit 1; }
          [[ "$alias_name" == "$KMS_ALIAS" ]]
          metadata="$(aws kms describe-key --key-id "$key_arn" --output json)"
          jq -e '.KeyMetadata.Enabled == true and .KeyMetadata.KeyState == "Enabled" and .KeyMetadata.KeyManager == "CUSTOMER" and .KeyMetadata.KeySpec == "SYMMETRIC_DEFAULT" and .KeyMetadata.KeyUsage == "ENCRYPT_DECRYPT" and .KeyMetadata.Origin == "AWS_KMS" and .KeyMetadata.MultiRegion == false' <<<"$metadata" >/dev/null
          aws kms get-key-rotation-status --key-id "$key_arn" --query KeyRotationEnabled --output text | grep -qx True
          tags="$(aws kms list-resource-tags --key-id "$key_arn" --output json)"
          jq -e '[.Tags[] | {(.TagKey): .TagValue}] | add | .Project == "SolveLang" and .Purpose == "customer-totp" and .Environment == "production"' <<<"$tags" >/dev/null
          alias_key_arn="$(aws kms describe-key --key-id "$KMS_ALIAS" --query 'KeyMetadata.Arn' --output text)"
          [[ "$alias_key_arn" == "$key_arn" ]]
          policy="$(aws kms get-key-policy --key-id "$key_arn" --policy-name default --query Policy --output text)"
          jq -e --arg root "arn:aws:iam::${account_id}:root" '[.Statement[] | select(.Effect == "Allow" and .Principal.AWS == $root and (.Action == "kms:*" or (.Action | type == "array" and index("kms:*") != null)))] | length >= 1' <<<"$policy" >/dev/null
          echo "key_arn=$key_arn" >> "$GITHUB_OUTPUT"

      - name: Verify production API baseline and capture exact starting state
        id: stack
        env:
          TARGET_TOTP_KMS_ARN: ${{ steps.kms.outputs.key_arn }}
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)"
          status="$(jq -r '.Stacks[0].StackStatus // empty' <<<"$stack")"
          [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE ]] || { echo "Production API stack is not stable: $status" >&2; exit 1; }
          api_base="$(jq -r '[.Stacks[0].Outputs[]? | select(.OutputKey == "ApiAccessBaseUrl") | .OutputValue] | first // empty' <<<"$stack")"
          test -n "$api_base"
          initial_api_access_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "ApiAccessEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          initial_customer_accounts_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerAccountsEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          initial_customer_totp_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpEnabled") | .ParameterValue] | first // "false"' <<<"$stack")"
          initial_customer_totp_kms_key_arn="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpKmsKeyArn") | .ParameterValue] | first // empty' <<<"$stack")"
          initial_subscription_billing_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "SubscriptionBillingEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          [[ -n "$initial_customer_totp_kms_key_arn" ]] || initial_customer_totp_kms_key_arn="$DISABLED_TOTP_KMS_ARN"
          [[ "$initial_api_access_enabled" == true ]]
          [[ "$initial_customer_accounts_enabled" == true ]]
          [[ "$initial_customer_totp_enabled" == true || "$initial_customer_totp_enabled" == false ]]
          [[ "$initial_subscription_billing_enabled" == false ]]
          if [[ "$initial_customer_totp_enabled" == true ]]; then
            [[ "$initial_customer_totp_kms_key_arn" == "$TARGET_TOTP_KMS_ARN" ]] || { echo "Production authenticator is already enabled with a different KMS key; refusing key migration." >&2; exit 1; }
          fi
          response="$(curl --fail --silent --show-error "$api_base/health")"
          jq -e --argjson customer_totp "$initial_customer_totp_enabled" '.status == "ok" and .enabled == true and .customerAccountsEnabled == true and .subscriptionBillingEnabled == false and (((has("customerTotpEnabled") | not) and $customer_totp == false) or .customerTotpEnabled == $customer_totp)' <<<"$response" >/dev/null
          {
            echo "api_base=$api_base"
            echo "initial_api_access_enabled=$initial_api_access_enabled"
            echo "initial_customer_accounts_enabled=$initial_customer_accounts_enabled"
            echo "initial_customer_totp_enabled=$initial_customer_totp_enabled"
            echo "initial_customer_totp_kms_key_arn=$initial_customer_totp_kms_key_arn"
          } >> "$GITHUB_OUTPUT"

      - name: Verify deployed frontend supports authenticator flow and exact production API
        env:
          API_BASE: ${{ steps.stack.outputs.api_base }}
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl --fail --silent --show-error --location "$SITE_ORIGIN/account/api-keys/")"
          mapfile -t scripts < <(grep -oE '<script[^>]+src="[^"]+"' <<<"$page" | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u)
          (( ${#scripts[@]} > 0 )) || { echo "No production customer-page script assets found." >&2; exit 1; }
          found_api=false
          found_totp=false
          combined=""
          for src in "${scripts[@]}"; do
            if [[ "$src" == https://* ]]; then asset_url="$src"; elif [[ "$src" == /* ]]; then asset_url="$SITE_ORIGIN$src"; else asset_url="$SITE_ORIGIN/$src"; fi
            asset="$(curl --fail --silent --show-error --location "$asset_url")"
            combined+=$'\n'"$asset"
            if grep -Fq -- "$API_BASE" <<<"$asset"; then found_api=true; fi
          done
          [[ "$found_api" == true ]] || { echo "Production customer frontend does not target the exact production API base." >&2; exit 1; }
          for marker in '/customer/auth/totp/verify' '/customer/auth/totp/setup' '/customer/auth/totp/confirm' '/customer/auth/totp/backup-codes' '/customer/auth/totp/disable'; do
            grep -Fq -- "$marker" <<<"$combined" || { echo "Production customer frontend is missing authenticator marker: $marker" >&2; exit 1; }
          done
          grep -Fq -- 'Authenticator app' <<<"$combined" || { echo "Production customer frontend is missing the authenticator UI." >&2; exit 1; }

      - name: Verify SES sender and production sending access
        shell: bash
        run: |
          set -euo pipefail
          aws sesv2 get-email-identity --email-identity "$CUSTOMER_AUTH_EMAIL_SENDER" --query 'VerifiedForSendingStatus' --output text | grep -qx True
          aws sesv2 get-account --query 'ProductionAccessEnabled' --output text | grep -qx True

      - name: Install pinned runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run API access tests
        run: npm test

      - name: Validate API access SAM template
        run: sam validate --lint --template template.yaml

      - name: Build API access stack
        run: sam build --template template.yaml

      - name: Validate TOTP KMS template
        run: aws cloudformation validate-template --template-body file://../../ops/aws/customer-totp-kms-template.yaml >/dev/null

      - name: Confirm candidate TOTP and billing safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CustomerTotpEnabled:' template.yaml
          grep -q 'Default: "false"' template.yaml
          grep -q 'CustomerTotpKmsKeyArn:' template.yaml
          grep -q 'Path: /customer/auth/totp/verify' template.yaml
          grep -q 'Path: /customer/auth/totp/setup' template.yaml
          grep -q 'kms:Encrypt' template.yaml
          grep -q 'kms:Decrypt' template.yaml
          grep -q 'SubscriptionBillingRemainsTestOnly' template.yaml
          ! grep -q 'secrets.STRIPE_SECRET_KEY' ../../.github/workflows/deploy-api-access-production-totp.yml
          ! grep -q 'secrets.STRIPE_SUBSCRIPTION_WEBHOOK_SECRET' ../../.github/workflows/deploy-api-access-production-totp.yml

      - name: Assume production deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare dedicated production SAM artifact bucket
        id: artifact-bucket
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          region_hash="$(printf '%s' "$AWS_REGION" | sha256sum | cut -c1-8)"
          bucket="solvelang-api-access-production-artifacts-${account_id}-${region_hash}"
          (( ${#bucket} <= 63 ))
          aws s3api head-bucket --bucket "$bucket" >/dev/null
          aws s3api put-public-access-block --bucket "$bucket" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$bucket" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Deploy production authenticator support with billing disabled
        id: deploy
        env:
          SAM_ARTIFACT_BUCKET: ${{ steps.artifact-bucket.outputs.bucket }}
          CUSTOMER_TOTP_KMS_KEY_ARN: ${{ steps.kms.outputs.key_arn }}
        shell: bash
        run: |
          set -euo pipefail
          parameter_overrides=(
            ApiAccessEnabled="$API_ACCESS_ENABLED"
            ApiAccessMode="$API_ACCESS_MODE"
            CustomerAccountsEnabled="$CUSTOMER_ACCOUNTS_ENABLED"
            CustomerTotpEnabled="$CUSTOMER_TOTP_ENABLED"
            CustomerTotpKmsKeyArn="$CUSTOMER_TOTP_KMS_KEY_ARN"
            SubscriptionBillingEnabled="$SUBSCRIPTION_BILLING_ENABLED"
            SiteOrigin="$SITE_ORIGIN"
            ApiKeyPepper="$API_KEY_PEPPER"
            ApiAccessAdminSecret="$API_ACCESS_ADMIN_SECRET"
            CustomerAuthPepper="$CUSTOMER_AUTH_PEPPER"
            CustomerAuthEmailSender="$CUSTOMER_AUTH_EMAIL_SENDER"
          )
          [[ -z "$CUSTOMER_AUTH_EMAIL_REPLY_TO" ]] || parameter_overrides+=(CustomerAuthEmailReplyTo="$CUSTOMER_AUTH_EMAIL_REPLY_TO")
          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --s3-prefix "$STACK_NAME-totp" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameter_overrides[@]}"

      - name: Verify production authenticator health and billing boundary
        env:
          API_BASE: ${{ steps.stack.outputs.api_base }}
          CUSTOMER_TOTP_KMS_KEY_ARN: ${{ steps.kms.outputs.key_arn }}
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)"
          current_totp="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          current_kms="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpKmsKeyArn") | .ParameterValue] | first // empty' <<<"$stack")"
          [[ "$current_totp" == true ]]
          [[ "$current_kms" == "$CUSTOMER_TOTP_KMS_KEY_ARN" ]]
          response="$(curl --fail --silent --show-error "$API_BASE/health")"
          jq -e '.status == "ok" and .enabled == true and .customerAccountsEnabled == true and .customerTotpEnabled == true and .subscriptionBillingEnabled == false' <<<"$response" >/dev/null
          webhook_status="$(curl --silent --output /tmp/solvelang-webhook-disabled.json --write-out '%{http_code}' -X POST "$API_BASE/stripe/subscriptions/webhook")"
          [[ "$webhook_status" == 503 ]]
          jq -e '.code == "subscription_billing_disabled"' /tmp/solvelang-webhook-disabled.json >/dev/null

      - name: Re-apply production operations baseline
        run: bash scripts/configure-production-foundation.sh "$STACK_NAME" "$AWS_REGION" "$OPERATIONS_ALARM_TOPIC_ARN"

      - name: Roll back to the exact pre-deploy feature state if post-deploy verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          SAM_ARTIFACT_BUCKET: ${{ steps.artifact-bucket.outputs.bucket }}
          API_BASE: ${{ steps.stack.outputs.api_base }}
          INITIAL_API_ACCESS_ENABLED: ${{ steps.stack.outputs.initial_api_access_enabled }}
          INITIAL_CUSTOMER_ACCOUNTS_ENABLED: ${{ steps.stack.outputs.initial_customer_accounts_enabled }}
          INITIAL_CUSTOMER_TOTP_ENABLED: ${{ steps.stack.outputs.initial_customer_totp_enabled }}
          INITIAL_CUSTOMER_TOTP_KMS_KEY_ARN: ${{ steps.stack.outputs.initial_customer_totp_kms_key_arn }}
        shell: bash
        run: bash scripts/rollback-production-customer-accounts.sh

      - name: Write deployment summary
        if: ${{ success() }}
        env:
          API_BASE: ${{ steps.stack.outputs.api_base }}
          CUSTOMER_TOTP_KMS_KEY_ARN: ${{ steps.kms.outputs.key_arn }}
        run: |
          printf '## SolveLang production authenticator 2FA deployment\n\n- Validated/deployed commit: `%s`\n- API stack: `%s`\n- Region: `%s`\n- API base: `%s`\n- API access enabled: **true**\n- Customer accounts enabled: **true**\n- Optional authenticator 2FA available: **true**\n- TOTP KMS key ARN: `%s`\n- Subscription billing enabled: **false**\n- Billing webhook disabled: verified\n- Stripe credentials injected: **no**\n- Email sent by deployment: **no**\n- Charges performed: **no**\n- Operations baseline: re-verified\n\nNo customer is enrolled by this workflow. Owner enrollment and recovery/email canaries remain separately controlled.\n' \
            "$GITHUB_SHA" "$STACK_NAME" "$AWS_REGION" "$API_BASE" "$CUSTOMER_TOTP_KMS_KEY_ARN" >> "$GITHUB_STEP_SUMMARY"
