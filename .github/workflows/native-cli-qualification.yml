name: Native CLI Qualification

on:
  pull_request:
    paths:
      - 'solvec/**'
      - 'solvec-core/**'
      - '.github/workflows/native-cli-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-cli-qualification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            python: python
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Verify source and native Rust host
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustc -vV | grep -Fx "host: $TARGET"
          git diff --exit-code
      - name: Format, lint and test native core
        working-directory: solvec-core
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --target "$TARGET" -- -D warnings
          cargo test --target "$TARGET"
      - name: Format, lint and test native CLI
        working-directory: solvec
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --target "$TARGET" -- -D warnings
          cargo test --locked --target "$TARGET"
      - name: Build, package and verify clean installation
        run: ${{ matrix.python }} solvec/scripts/qualify-native.py --target "$TARGET" --source "$SOURCE_SHA" --out "$RUNNER_TEMP/native-qualification"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-qualification/
          if-no-files-found: error
          retention-days: 14
