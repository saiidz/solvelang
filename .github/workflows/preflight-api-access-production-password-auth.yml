name: Preflight API Access Production Password Auth

on:
  workflow_dispatch:
    inputs:
      confirm_password_auth_preflight:
        description: Confirm validation-only password-auth readiness; do not deploy, send email, enable billing, use Stripe/webhooks, or perform charges
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-access-production-password-auth-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: api-access-production
    defaults:
      run:
        working-directory: services/api-access
    env:
      API_ACCESS_MODE: live
      API_ACCESS_ENABLED: "true"
      CUSTOMER_ACCOUNTS_ENABLED: "true"
      SUBSCRIPTION_BILLING_ENABLED: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.API_ACCESS_STACK_NAME }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      CUSTOMER_AUTH_EMAIL_SENDER: ${{ vars.CUSTOMER_AUTH_EMAIL_SENDER }}
      API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
      API_ACCESS_ADMIN_SECRET: ${{ secrets.API_ACCESS_ADMIN_SECRET }}
      CUSTOMER_AUTH_PEPPER: ${{ secrets.CUSTOMER_AUTH_PEPPER }}

    steps:
      - uses: actions/checkout@v4

      - name: Enforce validation-only production password-auth boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production password-auth preflight must run from main." >&2; exit 1; }
          [[ "${{ inputs.confirm_password_auth_preflight }}" == "true" ]] || { echo "Explicit password-auth preflight confirmation is required." >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Checked-out commit does not match GITHUB_SHA." >&2; exit 1; }
          [[ "$API_ACCESS_MODE" == live ]]
          [[ "$API_ACCESS_ENABLED" == true ]]
          [[ "$CUSTOMER_ACCOUNTS_ENABLED" == true ]]
          [[ "$SUBSCRIPTION_BILLING_ENABLED" == false ]]
          [[ "$STACK_NAME" == *prod* || "$STACK_NAME" == *production* ]] || { echo "Production stack name must contain prod or production." >&2; exit 1; }
          [[ "$STACK_NAME" != *test* ]] || { echo "Production stack name must not contain test." >&2; exit 1; }
          [[ "$SITE_ORIGIN" == https://* ]]
          test -n "$AWS_REGION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Validate independent production auth secrets
        shell: bash
        run: |
          set -euo pipefail
          require_length() { (( ${#2} >= $3 )) || { echo "$1 must contain at least $3 characters." >&2; exit 1; }; }
          require_length API_KEY_PEPPER "$API_KEY_PEPPER" 32
          require_length API_ACCESS_ADMIN_SECRET "$API_ACCESS_ADMIN_SECRET" 32
          require_length CUSTOMER_AUTH_PEPPER "$CUSTOMER_AUTH_PEPPER" 32
          [[ "$API_KEY_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_KEY_PEPPER" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          test -n "$CUSTOMER_AUTH_EMAIL_SENDER"

      - name: Verify current production stack remains live with billing disabled
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          stack_description="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)"
          status="$(jq -r '.Stacks[0].StackStatus // empty' <<<"$stack_description")"
          [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE ]] || { echo "Production stack is not stable: $status" >&2; exit 1; }
          api_base="$(jq -r '[.Stacks[0].Outputs[]? | select(.OutputKey == "ApiAccessBaseUrl") | .OutputValue] | first // empty' <<<"$stack_description")"
          test -n "$api_base"
          current_api_access_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "ApiAccessEnabled") | .ParameterValue] | first // empty' <<<"$stack_description")"
          current_customer_accounts_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerAccountsEnabled") | .ParameterValue] | first // empty' <<<"$stack_description")"
          current_subscription_billing_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "SubscriptionBillingEnabled") | .ParameterValue] | first // empty' <<<"$stack_description")"
          [[ "$current_api_access_enabled" == true ]] || { echo "Production API access must already be enabled before password-auth rollout." >&2; exit 1; }
          [[ "$current_customer_accounts_enabled" == true ]] || { echo "Production customer accounts must already be enabled before password-auth rollout." >&2; exit 1; }
          [[ "$current_subscription_billing_enabled" == false ]] || { echo "Production subscription billing must remain disabled." >&2; exit 1; }
          response="$(curl --fail --silent --show-error "$api_base/health")"
          jq -e '.status == "ok" and .enabled == true and .customerAccountsEnabled == true and .subscriptionBillingEnabled == false' <<<"$response" >/dev/null
          echo "api_base=$api_base" >> "$GITHUB_OUTPUT"

      - name: Verify deployed customer frontend targets exact production API
        env:
          API_BASE: ${{ steps.stack.outputs.api_base }}
        shell: bash
        run: |
          set -euo pipefail
          page_url="$SITE_ORIGIN/account/api-keys/"
          page="$(curl --fail --silent --show-error --location "$page_url")"
          test -n "$page"
          mapfile -t scripts < <(
            grep -oE '<script[^>]+src="[^"]+"' <<<"$page" \
              | sed -E 's/.*src="([^"]+)".*/\1/' \
              | sort -u
          )
          (( ${#scripts[@]} > 0 )) || { echo "No frontend script assets were found on the production customer page." >&2; exit 1; }
          found=false
          for src in "${scripts[@]}"; do
            if [[ "$src" == https://* ]]; then
              asset_url="$src"
            elif [[ "$src" == /* ]]; then
              asset_url="$SITE_ORIGIN$src"
            else
              asset_url="$SITE_ORIGIN/$src"
            fi
            asset="$(curl --fail --silent --show-error --location "$asset_url")"
            if grep -Fq -- "\"$API_BASE\"" <<<"$asset" || grep -Fq -- "'$API_BASE'" <<<"$asset"; then
              found=true
              break
            fi
          done
          [[ "$found" == true ]] || {
            echo "The deployed customer frontend does not contain the exact production API base string from CloudFormation: $API_BASE" >&2
            echo "Set NEXT_PUBLIC_API_ACCESS_BASE_URL exactly to the production API base before password-auth rollout." >&2
            exit 1
          }

      - name: Verify SES sender and production sending access
        shell: bash
        run: |
          set -euo pipefail
          aws sesv2 get-email-identity \
            --email-identity "$CUSTOMER_AUTH_EMAIL_SENDER" \
            --query 'VerifiedForSendingStatus' \
            --output text | grep -qx True
          aws sesv2 get-account \
            --query 'ProductionAccessEnabled' \
            --output text | grep -qx True

      - name: Install pinned runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run API access tests
        run: npm test

      - name: Validate SAM template
        run: sam validate --lint --template template.yaml

      - name: Build API access stack
        run: sam build --template template.yaml

      - name: Confirm password-auth implementation and deployment safety
        shell: bash
        run: |
          set -euo pipefail
          deploy_workflow="../../.github/workflows/deploy-api-access-production-customer-accounts.yml"
          grep -q 'Path: /customer/auth/password' template.yaml
          grep -q 'Path: /customer/auth/credentials' template.yaml
          grep -q 'scrypt-v1' src/customer-auth.js
          grep -q 'authVersion' src/customer-auth.js
          grep -q 'authVersion' src/customer-auth-store.js
          grep -q 'SubscriptionBillingRemainsTestOnly' template.yaml
          grep -q 'Subscription billing is test-mode only until production review is complete.' template.yaml
          grep -q 'API_ACCESS_ENABLED: "true"' "$deploy_workflow"
          grep -q 'CUSTOMER_ACCOUNTS_ENABLED: "true"' "$deploy_workflow"
          grep -q 'SUBSCRIPTION_BILLING_ENABLED: "false"' "$deploy_workflow"
          grep -q 'Wait for earlier production deployment requests' "$deploy_workflow"
          grep -q 'INITIAL_API_ACCESS_ENABLED' "$deploy_workflow"
          grep -q 'INITIAL_CUSTOMER_ACCOUNTS_ENABLED' "$deploy_workflow"
          grep -q 'rollback-production-customer-accounts.sh' "$deploy_workflow"
          ! grep -q 'STRIPE_SECRET_KEY' "$deploy_workflow"
          ! grep -q 'STRIPE_SUBSCRIPTION_WEBHOOK_SECRET' "$deploy_workflow"

      - name: Write readiness summary
        env:
          API_BASE: ${{ steps.stack.outputs.api_base }}
        run: |
          printf '## SolveLang production password-auth preflight\n\n- Validated commit: `%s`\n- Production stack: `%s`\n- Region: `%s`\n- API base: `%s`\n- Current API access enabled: **true**\n- Current customer accounts enabled: **true**\n- Current subscription billing enabled: **false**\n- Customer-auth pepper: validated and independent\n- SES sender: verified\n- SES production sending access: verified\n- Customer page: reachable and compiled with the exact production API base\n- Password login and credential routes: present in the candidate template\n- Password hashing and auth-version session revocation: present and test-covered\n- Deployment rollback/serialization safeguards: present\n- Tests/SAM validation/build: passed\n- Deployment performed: **no**\n- Email sent: **no**\n- Stripe/webhook used: **no**\n- Charges performed: **no**\n\nPassing this workflow is readiness evidence only. Password-auth production deployment still requires separate explicit owner approval.\n' \
            "$GITHUB_SHA" "$STACK_NAME" "$AWS_REGION" "$API_BASE" >> "$GITHUB_STEP_SUMMARY"
