name: Board Logs Harness

# ONE-OFF OPERATOR HARNESS (Nov 12, 2026) for diagnosing the Live Center
# board read. It assumes the same pilot deploy role as the pilot
# dispatcher and READS ONLY: the pilot stack's QueueFunction identity and
# configuration metadata (environment variable NAMES only, never values),
# and the function's CloudWatch log lines matching the handler's own
# sanitized error marker ("merge_governance_error" — the handler logs
# only an error message class plus a bare numeric status, never upstream
# content, tokens, or payloads). Dispatch is manual, gated by the
# api-access-production environment, and requires the
# confirm_board_logs input. This workflow never writes or deploys
# anything.

on:
  workflow_dispatch:
    inputs:
      confirm_board_logs:
        description: Confirm reading the pilot QueueFunction logs and config metadata (read-only)
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  logs:
    runs-on: [self-hosted, Linux, ARM64, oracle-free, solvelang-ci]
    environment: api-access-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: solvelang-merge-governance-pilot

    steps:
      - name: Enforce logs boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Board logs harness must run from main." >&2; exit 1; }
          [[ "${{ inputs.confirm_board_logs }}" == "true" ]] || { echo "Explicit board-logs confirmation is required." >&2; exit 1; }
          [[ "$STACK_NAME" == "solvelang-merge-governance-pilot" ]] || { echo "Unexpected stack name." >&2; exit 1; }
          test -n "$AWS_REGION"

      - name: Install AWS CLI into the job workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "$RUNNER_TEMP/awscliv2.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/awscliv2.zip" "$RUNNER_TEMP"
          for f in "$RUNNER_TEMP/aws/install" "$RUNNER_TEMP/aws/dist/aws" "$RUNNER_TEMP/aws/dist/aws_completer"; do
            if [[ -f "$f" ]]; then chmod +x "$f"; fi
          done
          "$RUNNER_TEMP/aws/install" --install-dir "$RUNNER_TEMP/aws-cli/lib" --bin-dir "$RUNNER_TEMP/aws-cli/bin"
          echo "$RUNNER_TEMP/aws-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/aws-cli/bin/aws" --version

      - name: Assume pilot deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read pilot function errors
        shell: bash
        run: |
          set -euo pipefail
          FN=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" \
            --query "StackResources[?LogicalResourceId=='QueueFunction'].PhysicalResourceId | [0]" --output text)
          echo "QueueFunction: $FN"
          {
            echo "## Pilot QueueFunction"
            echo "- function: \`$FN\`"
            aws lambda get-function-configuration --function-name "$FN" \
              --query "{MemorySize: MemorySize, Timeout: Timeout, LastModified: LastModified, Runtime: Runtime}" --output table || true
            echo "- env keys (names only):"
            aws lambda get-function-configuration --function-name "$FN" \
              --query "Environment.Variables | keys(@)" --output text || true
          } >> "$GITHUB_STEP_SUMMARY"
          START_MS=$(( ( $(date +%s) - 43200 ) * 1000 ))
          echo "--- merge_governance_error lines (last 12h) ---"
          aws logs filter-log-events --log-group-name "/aws/lambda/$FN" \
            --start-time "$START_MS" --filter-pattern "merge_governance_error" \
            --query "events[].message" --output text | tail -30
          echo "--- timeout / fatal lines (last 12h) ---"
          aws logs filter-log-events --log-group-name "/aws/lambda/$FN" \
            --start-time "$START_MS" --filter-pattern "\"Task timed out\"" \
            --query "events[].message" --output text | tail -5 || true
