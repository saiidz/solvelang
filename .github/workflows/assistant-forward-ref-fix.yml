name: Assistant forward-reference P1 fix

on:
  push:
    branches:
      - codex/issue-772-pure-evaluator
    paths:
      - .github/workflows/assistant-forward-ref-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-772-pure-evaluator
          fetch-depth: 0

      - name: Patch permissive forward-reference preflight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evaluator_path = Path("solvec-core/src/evaluator.rs")
          lines = evaluator_path.read_text().splitlines(keepends=True)
          anchor = "} else if !is_pure_builtin(name) && !function_names.contains(name) {"
          matches = [index for index, line in enumerate(lines) if anchor in line]
          if len(matches) != 1:
              raise SystemExit(f"expected one evaluator anchor, found {len(matches)}")
          index = matches[0]
          window = "".join(lines[index:index + 7])
          required = [
              "return Err(self.error_at(",
              "expression.location,",
              "format!(\"unknown function '{}'\", name),",
              "None,",
              "));",
          ]
          if not all(fragment in window for fragment in required):
              raise SystemExit(f"unexpected evaluator target window:\n{window}")
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          replacement = [
              f"{indent}}} else if !is_pure_builtin(name) && !function_names.contains(name) {{\n",
              f"{indent}    if module_imports.and_then(|imports| imports.get(name))\n",
              f"{indent}        == Some(&ExportKind::Let)\n",
              f"{indent}    {{\n",
              f"{indent}        return Err(self.error_at(\n",
              f"{indent}            expression.location,\n",
              f"{indent}            format!(\"unknown function '{{}}'\", name),\n",
              f"{indent}            None,\n",
              f"{indent}        ));\n",
              f"{indent}    }}\n",
              f"{indent}    self.authorize_at(\n",
              f"{indent}        Capability::UnknownCall(name.clone()),\n",
              f"{indent}        expression.location,\n",
              f"{indent}        budget,\n",
              f"{indent}    )?;\n",
              f"{indent}}}\n",
          ]
          lines[index:index + 7] = replacement
          evaluator_path.write_text("".join(lines))

          tests_path = Path("solvec-core/tests/evaluator.rs")
          tests = tests_path.read_text()

          def replace_section(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"missing section start: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"missing section end: {end!r}")
              return text[:start_index] + replacement + text[end_index:]

          tests = replace_section(
              tests,
              '#[test]\nfn unknown_calls_fail_closed_even_when_the_host_allows_capabilities() {',
              '#[test]\nfn retained_agent_metadata_is_aggregate_bounded_and_atomic() {',
              '''#[test]
          fn unknown_calls_are_authorized_before_runtime_resolution_when_host_allows_them() {
              let source = "unsupported_call()\\n";
              let mut evaluator = Evaluator::new(RecordingHost::default());

              let error = evaluator
                  .run(&parse(source))
                  .expect_err("runtime resolution rejects an actually unknown call");

              assert_eq!(error.kind(), RuntimeErrorKind::Evaluation);
              assert!(
                  error
                      .message()
                      .contains("unknown function 'unsupported_call'")
              );
              assert!(error.capability().is_none());
              assert!(
                  evaluator
                      .host()
                      .authorized
                      .borrow()
                      .contains(&Capability::UnknownCall("unsupported_call".to_string()))
              );
              assert!(evaluator.host().requests.is_empty());
              assert!(evaluator.host().outputs.is_empty());
              assert!(evaluator.outputs().is_empty());
          }

          ''',
          )

          tests = replace_section(
              tests,
              '#[test]\nfn preflight_rejects_calls_before_declaration_without_resetting_prior_state() {',
              '#[test]\nfn plain_runs_preserve_variables_functions_and_outputs_across_reuse() {',
              '''#[test]
          fn permissive_preflight_preserves_forward_references_declared_before_runtime_call() {
              let source = "fn first() { return later() }\\nfn later() { return 1 }\\nprint(first())\\n";
              let mut evaluator = Evaluator::new(RecordingHost::default());

              evaluator
                  .run(&parse(source))
                  .expect("permissive policy preserves a valid forward function reference");

              assert_eq!(evaluator.outputs(), &[Value::Number(1)]);
              assert!(
                  evaluator
                      .host()
                      .authorized
                      .borrow()
                      .contains(&Capability::UnknownCall("later".to_string()))
              );
          }

          #[test]
          fn deny_all_preflight_rejects_calls_before_declaration_without_resetting_prior_state() {
              let mut evaluator = Evaluator::with_input(
                  DenyAllHost,
                  "print(1)\\n",
                  "first.solve",
                  Some(Value::Text("preserved".to_string())),
              );
              evaluator
                  .run(&parse("print(1)\\n"))
                  .expect("initial run succeeds");
              assert_eq!(evaluator.outputs(), &[Value::Number(1)]);

              let denied = "print(\\\"must not replace prior output\\\")\\nlater()\\nfn later() { return 1 }\\n";
              evaluator.set_source_context(denied, "denied.solve");
              let error = evaluator
                  .run(&parse(denied))
                  .expect_err("hardened preflight rejects a forward call before execution");

              assert_eq!(error.kind(), RuntimeErrorKind::CapabilityDenied);
              assert_eq!(
                  error.capability(),
                  Some(&Capability::UnknownCall("later".to_string()))
              );
              assert_eq!(error.source_name(), Some("denied.solve"));
              assert_eq!(evaluator.outputs(), &[Value::Number(1)]);
          }

          ''',
          )

          tests_path.write_text(tests)
          PY

      - name: Format and validate core
        shell: bash
        run: |
          cargo fmt --manifest-path solvec-core/Cargo.toml
          cargo test --manifest-path solvec-core/Cargo.toml
          git diff --check

      - name: Commit reviewed fix and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/assistant-forward-ref-fix.yml
          git add solvec-core/src/evaluator.rs solvec-core/tests/evaluator.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(core): preserve permissive forward references"
          git push origin HEAD:codex/issue-772-pure-evaluator
