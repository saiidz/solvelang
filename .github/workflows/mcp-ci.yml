name: MCP CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'
      - 'plugins/codex/**'
      - 'plugins/claude/**'
      - 'plugins/solvelang/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mcp-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'
      - 'plugins/codex/**'
      - 'plugins/claude/**'
      - 'plugins/solvelang/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mcp-ci.yml'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit exact locked dependencies
        id: audit
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Capture isolated remediation proposal without modifying source
        if: ${{ failure() && steps.audit.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          proposal="$(mktemp -d)"
          trap 'rm -rf "$proposal"' EXIT
          cp package.json package-lock.json "$proposal/"
          (
            cd "$proposal"
            npm audit fix --package-lock-only --ignore-scripts --no-fund --registry=https://registry.npmjs.org
            npm audit --package-lock-only --ignore-scripts --audit-level=high
          )
          cmp package.json "$proposal/package.json"
          echo '::group::Proposed lockfile diff (not applied)'
          diff -u package-lock.json "$proposal/package-lock.json" || test "$?" -eq 1
          echo '::endgroup::'
          echo '::group::Proposed lockfile transport (gzip+base64, not applied)'
          sha256sum "$proposal/package-lock.json"
          gzip -n -c "$proposal/package-lock.json" | base64 -w 0
          echo
          echo '::endgroup::'

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Run Solve Context offline evals
        run: npm run eval:context
      - name: Validate Codex and Claude plugin packaging
        run: node scripts/validate-plugin-packaging.mjs
      - name: Prove Codex and Claude plugin MCP roundtrip
        run: npm run test:plugin-roundtrip
      - name: Verify packed consumer install and npx entrypoint
        run: npm run test:packed
