name: MCP CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'
      - 'plugins/codex/**'
      - 'plugins/claude/**'
      - 'plugins/solvelang/**'
      - 'ops/distribution/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mcp-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'
      - 'plugins/codex/**'
      - 'plugins/claude/**'
      - 'plugins/solvelang/**'
      - 'ops/distribution/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/mcp-ci.yml'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit exact locked dependencies
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate selected release candidate boundary
        run: npm run test:release-candidate
      - name: Qualify staged v0.3.0 release finalization
        run: npm run test:release-finalization
      - name: Rehearse full v0.3.0 distribution transition
        run: npm run test:distribution-finalization
      - name: Validate Codex GitHub marketplace import contract
        run: node ../../ops/distribution/validate-codex-marketplace-import.mjs
      - name: Run Solve Context offline evals
        run: npm run eval:context
      - name: Run pinned real-source context regressions
        run: npm run eval:context:repository
      - name: Run independent pinned repository context regressions
        run: npm run eval:context:independent
      - name: Validate precommitted heldout evaluation protocol
        run: npm run test:context-holdout
      - name: Validate offline agent-eval record/report contract
        run: npm run test:context-agent-eval-cli
      - name: Validate Codex and Claude plugin packaging
        run: node scripts/validate-plugin-packaging.mjs
      - name: Prove Codex and Claude plugin MCP roundtrip
        run: npm run test:plugin-roundtrip
      - name: Verify packed consumer install and npx entrypoint
        run: npm run test:packed
