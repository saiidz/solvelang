name: Trusted Mac CI

on:
  push:
    branches:
      - "agent/mac-*"

permissions:
  contents: read

# SolveLang has one owner-allocated self-hosted Mac runner slot. Serialize
# validation per trusted branch so a newer push can replace only stale pending
# work from that same branch without dropping another branch's exact-head run.
# Automation must still avoid intentionally stacking multiple agent/mac-* jobs
# while the single SolveLang Mac slot is busy.
concurrency:
  group: trusted-mac-solvelang-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-audit-site:
    name: Repository Audit on Mac
    if: github.repository == 'saiidz/solvelang' && github.actor == 'saiidz'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: caffeinate -dimsu npm ci

      - name: Run deterministic Studio and audit tests
        run: caffeinate -dimsu npm run test:studio

      - name: Run lint
        run: caffeinate -dimsu npm run lint

      - name: Build static site
        run: caffeinate -dimsu npm run build

      - name: Verify exported document languages
        run: caffeinate -dimsu npm run verify:i18n-export
