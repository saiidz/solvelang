name: Trusted Mac CI

on:
  push:
    branches:
      - "agent/mac-*"

permissions:
  contents: read
  statuses: write

concurrency:
  group: trusted-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-pending:
    name: Publish Trusted Mac pending status
    if: github.repository == 'saiidz/solvelang'
    runs-on: ubuntu-latest
    steps:
      - name: Mark exact pushed commit pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'trusted-mac-ci',
              description: 'Trusted Mac CI queued for the exact pushed commit.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  repository-audit-site:
    name: Repository Audit on Mac
    if: github.repository == 'saiidz/solvelang'
    needs: publish-pending
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic Studio and audit tests
        run: npm run test:studio

      - name: Run lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Verify exported document languages
        run: npm run verify:i18n-export
