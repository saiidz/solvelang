name: Trusted Mac CI

on:
  push:
    branches:
      - "agent/mac-*"

permissions:
  contents: read

# SolveLang has one owner-allocated self-hosted Mac runner slot. Do not use a
# shared GitHub Actions concurrency group here: a group retains only one
# pending run and can replace an independent branch's exact-head validation.
# The single allocated runner provides execution serialization; automation
# must avoid stacking duplicate pushes while that slot is busy.
jobs:
  repository-audit-site:
    name: Repository Audit on Mac
    if: github.repository == 'saiidz/solvelang'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: caffeinate -dimsu npm ci

      - name: Run deterministic Studio and audit tests
        run: caffeinate -dimsu npm run test:studio

      - name: Run lint
        run: caffeinate -dimsu npm run lint

      - name: Build static site
        run: caffeinate -dimsu npm run build

      - name: Verify exported document languages
        run: caffeinate -dimsu npm run verify:i18n-export
