name: Deploy API Access Production Redeploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_redeploy:
        description: Confirm redeploying the current main code onto the live production API stack
        required: true
        default: false
        type: boolean
      confirm_preserve_exact_feature_state:
        description: Confirm the deploy preserves the exact current production feature state (API, accounts, TOTP, CRM, billing) and creates no charge
        required: true
        default: false
        type: boolean
      confirm_stripe_account_reviewed:
        description: Confirm the protected live Stripe account ID is the intended legal billing account for SolveLang
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, oracle-free, solvelang-ci]
    environment: api-access-production
    defaults:
      run:
        working-directory: services/api-access
    env:
      API_ACCESS_MODE: live
      API_ACCESS_ENABLED: "true"
      CUSTOMER_ACCOUNTS_ENABLED: "true"
      SUBSCRIPTION_BILLING_ENABLED: "true"
      DISABLED_TOTP_KMS_ARN: arn:aws:kms:us-east-1:000000000000:key/disabled
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.API_ACCESS_STACK_NAME }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      CUSTOMER_AUTH_EMAIL_SENDER: ${{ vars.CUSTOMER_AUTH_EMAIL_SENDER }}
      CUSTOMER_AUTH_EMAIL_REPLY_TO: ${{ vars.CUSTOMER_AUTH_EMAIL_REPLY_TO }}
      OPERATIONS_ALARM_TOPIC_ARN: ${{ vars.OPERATIONS_ALARM_TOPIC_ARN }}
      STRIPE_EXPECTED_ACCOUNT_ID: ${{ vars.STRIPE_EXPECTED_ACCOUNT_ID }}
      STRIPE_API_DEVELOPER_PRICE_ID: ${{ vars.STRIPE_API_DEVELOPER_PRICE_ID }}
      STRIPE_API_PRO_PRICE_ID: ${{ vars.STRIPE_API_PRO_PRICE_ID }}
      STRIPE_API_BUSINESS_PRICE_ID: ${{ vars.STRIPE_API_BUSINESS_PRICE_ID }}
      API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}
      API_ACCESS_ADMIN_SECRET: ${{ secrets.API_ACCESS_ADMIN_SECRET }}
      CUSTOMER_AUTH_PEPPER: ${{ secrets.CUSTOMER_AUTH_PEPPER }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_SUBSCRIPTION_WEBHOOK_SECRET: ${{ secrets.STRIPE_SUBSCRIPTION_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Enforce protected production redeploy boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production redeploy must run from main." >&2; exit 1; }
          [[ "${{ inputs.confirm_production_redeploy }}" == "true" ]] || { echo "Explicit production redeploy confirmation is required." >&2; exit 1; }
          [[ "${{ inputs.confirm_stripe_account_reviewed }}" == "true" ]] || { echo "Explicit Stripe account identity confirmation is required." >&2; exit 1; }
          [[ "${{ inputs.confirm_preserve_exact_feature_state }}" == "true" ]] || { echo "Explicit feature-state preservation confirmation is required." >&2; exit 1; }
          [[ "$API_ACCESS_MODE" == live ]]
          [[ "$API_ACCESS_ENABLED" == true ]]
          [[ "$CUSTOMER_ACCOUNTS_ENABLED" == true ]]
          [[ "$SUBSCRIPTION_BILLING_ENABLED" == true ]]
          [[ "$STACK_NAME" == *prod* || "$STACK_NAME" == *production* ]] || { echo "Production stack name must contain prod or production." >&2; exit 1; }
          [[ "$STACK_NAME" != *test* ]] || { echo "Production stack name must not contain test." >&2; exit 1; }
          [[ "$SITE_ORIGIN" == https://* ]]
          [[ "$OPERATIONS_ALARM_TOPIC_ARN" == arn:aws:sns:${AWS_REGION}:*:* ]] || { echo "OPERATIONS_ALARM_TOPIC_ARN must be an SNS topic in the production region." >&2; exit 1; }
          [[ "$STRIPE_EXPECTED_ACCOUNT_ID" == "acct_1TRDmL4HWc7PvaDY" ]] || { echo "Protected Stripe account ID does not match the reviewed SolveLang merchant account." >&2; exit 1; }
          [[ "$STRIPE_SECRET_KEY" == sk_live_* || "$STRIPE_SECRET_KEY" == rk_live_* ]] || { echo "Production requires an sk_live_* or rk_live_* Stripe key." >&2; exit 1; }
          [[ "$STRIPE_SECRET_KEY" != sk_test_* && "$STRIPE_SECRET_KEY" != rk_test_* ]]
          [[ "$STRIPE_SUBSCRIPTION_WEBHOOK_SECRET" == whsec_* ]] || { echo "Production requires a Stripe webhook signing secret." >&2; exit 1; }
          [[ "$STRIPE_API_DEVELOPER_PRICE_ID" == "price_1U2jBo4HWc7PvaDYXcET6RX9" ]]
          [[ "$STRIPE_API_PRO_PRICE_ID" == "price_1U2jCa4HWc7PvaDYNE8wPhgr" ]]
          [[ "$STRIPE_API_BUSINESS_PRICE_ID" == "price_1U2jCx4HWc7PvaDYIvE3ne0Y" ]]
          (( ${#API_KEY_PEPPER} >= 32 ))
          (( ${#API_ACCESS_ADMIN_SECRET} >= 32 ))
          (( ${#CUSTOMER_AUTH_PEPPER} >= 32 ))
          [[ "$API_KEY_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_KEY_PEPPER" ]]
          [[ "$CUSTOMER_AUTH_PEPPER" != "$API_ACCESS_ADMIN_SECRET" ]]
          test -n "$CUSTOMER_AUTH_EMAIL_SENDER"
          test -n "$AWS_REGION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for earlier production deployment requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deployment-turn.mjs

      - name: Assume production read-only preflight role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Install AWS CLI into the job workspace
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "$RUNNER_TEMP/awscliv2.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/awscliv2.zip" "$RUNNER_TEMP"
          for f in "$RUNNER_TEMP/aws/install" "$RUNNER_TEMP/aws/dist/aws" "$RUNNER_TEMP/aws/dist/aws_completer"; do
            if [[ -f "$f" ]]; then chmod +x "$f"; fi
          done
          "$RUNNER_TEMP/aws/install" --install-dir "$RUNNER_TEMP/aws-cli/lib" --bin-dir "$RUNNER_TEMP/aws-cli/bin"
          echo "$RUNNER_TEMP/aws-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/aws-cli/bin/aws" --version

      - name: Capture exact production feature state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)"
          status="$(jq -r '.Stacks[0].StackStatus // empty' <<<"$stack")"
          [[ "$status" == CREATE_COMPLETE || "$status" == UPDATE_COMPLETE || "$status" == UPDATE_ROLLBACK_COMPLETE || "$status" == IMPORT_COMPLETE ]] || { echo "Production stack is not stable: $status" >&2; exit 1; }

          api_base="$(jq -r '[.Stacks[0].Outputs[]? | select(.OutputKey == "ApiAccessBaseUrl") | .OutputValue] | first // empty' <<<"$stack")"
          api_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "ApiAccessEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          accounts_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerAccountsEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          totp_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpEnabled") | .ParameterValue] | first // "false"' <<<"$stack")"
          totp_kms="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "CustomerTotpKmsKeyArn") | .ParameterValue] | first // empty' <<<"$stack")"
          crm_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "AdminCrmEnabled") | .ParameterValue] | first // "false"' <<<"$stack")"
          billing_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "SubscriptionBillingEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          [[ -n "$totp_kms" ]] || totp_kms="$DISABLED_TOTP_KMS_ARN"

          [[ "$api_enabled" == true ]] || { echo "Production API access must already be enabled." >&2; exit 1; }
          [[ "$accounts_enabled" == true ]] || { echo "Production customer accounts must already be enabled." >&2; exit 1; }
          [[ "$billing_enabled" == true ]] || { echo "Production subscription billing must already be enabled for a state-preserving redeploy." >&2; exit 1; }
          [[ "$totp_enabled" == true || "$totp_enabled" == false ]]
          [[ "$crm_enabled" == true || "$crm_enabled" == false ]]
          [[ "$totp_kms" =~ ^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/.+$ ]]

          if [[ "$totp_enabled" == true ]]; then
            [[ "$totp_kms" != "$DISABLED_TOTP_KMS_ARN" ]] || { echo "Enabled TOTP has no real KMS key." >&2; exit 1; }
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            [[ "$totp_kms" == "arn:aws:kms:${AWS_REGION}:${account_id}:key/"* ]] || { echo "TOTP KMS key must belong to the production account and region." >&2; exit 1; }
            key_metadata="$(aws kms describe-key --key-id "$totp_kms" --output json)"
            jq -e '.KeyMetadata.KeyState == "Enabled" and .KeyMetadata.KeyManager == "CUSTOMER" and .KeyMetadata.KeySpec == "SYMMETRIC_DEFAULT" and .KeyMetadata.KeyUsage == "ENCRYPT_DECRYPT" and .KeyMetadata.MultiRegion == false' <<<"$key_metadata" >/dev/null
            aws kms get-key-rotation-status --key-id "$totp_kms" --query KeyRotationEnabled --output text | grep -qx True
          fi


          {
            echo "api_base=$api_base"
            echo "totp_enabled=$totp_enabled"
            echo "totp_kms=$totp_kms"
            echo "crm_enabled=$crm_enabled"
            echo "billing_enabled=$billing_enabled"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact live Stripe prices without charging
        env:
          API_BASE: ${{ steps.before.outputs.api_base }}
        shell: bash
        run: |
          set -euo pipefail
          verify_price() {
            local price_id="$1" expected_amount="$2" expected_product="$3"
            local response
            response="$(curl --fail --silent --show-error --user "$STRIPE_SECRET_KEY:" "https://api.stripe.com/v1/prices/$price_id")"
            jq -e \
              --argjson amount "$expected_amount" \
              --arg product "$expected_product" \
              '.active == true and .livemode == true and .type == "recurring" and .currency == "usd" and .unit_amount == $amount and .recurring.interval == "month" and .recurring.interval_count == 1 and .product == $product' \
              <<<"$response" >/dev/null
          }
          verify_price "$STRIPE_API_DEVELOPER_PRICE_ID" 4900 prod_V2op9bJQn8wIsP
          verify_price "$STRIPE_API_PRO_PRICE_ID" 19900 prod_V2oqkvbRI97wSl
          verify_price "$STRIPE_API_BUSINESS_PRICE_ID" 69900 prod_V2oq35mur6QFXW


      - name: Validate production redeploy candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          sam validate --lint --template template.yaml
          sam build --template template.yaml
          grep -q '^  SubscriptionBillingRequirements:' template.yaml
          grep -q 'Subscription billing requires a Stripe secret key.' template.yaml
          grep -q 'Subscription billing requires a signed webhook secret.' template.yaml
          ! grep -q '^  SubscriptionBillingRemainsTestOnly:' template.yaml

      - name: Assume production deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Assume production deploy role (refresh before import)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Import pre-existing Lambda log groups into stack management
        shell: bash
        run: |
          set -euo pipefail
          # Commit 8785f27e added explicit LogGroup resources (90-day retention) for
          # functions that already existed, so Lambda had auto-created their log
          # groups outside stack management and CloudFormation cannot create them
          # (AlreadyExists). Deleting them does not work either: live traffic makes
          # Lambda re-create a group seconds later. Import the existing groups.
          # A group that does not exist at all cannot be imported: attempt 4
          # deleted the ApiKeyAuthorizer group and that function has not run
          # since, so Lambda never re-created it - the attempt-12 change set
          # FAILED with "was not found". Probe existence first and import
          # only groups that exist; the deploy step creates any missing
          # group from the template.
          aws --version
          # describe-stack-resource (singular) is unusable with this CLI: its
          # response makes the CLI die with "'str' object has no attribute
          # 'items'" (redeploy attempt 5, run 39992188311). Fetch the full
          # resource list once (plural API) and resolve everything locally.
          echo "Stack status on entry: $(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json | jq -r '.Stacks[0].StackStatus')"
          resources_json="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --output json)"
          pending_ids=()
          pending_pairs=()
          import_json="[]"
          for pair in "ApiAccessFunctionLogGroup ApiAccessFunction" "PublicStatusCollectorFunctionLogGroup PublicStatusCollectorFunction" "ApiKeyAuthorizerFunctionLogGroup ApiKeyAuthorizerFunction"; do
            set -- $pair
            if jq -e --arg id "$1" '.StackResources[] | select(.LogicalResourceId == $id)' <<<"$resources_json" >/dev/null; then
              echo "$1 already stack-managed; skipping."
            else
              function_name="$(jq -r --arg id "$2" '.StackResources[] | select(.LogicalResourceId == $id) | .PhysicalResourceId' <<<"$resources_json")"
              [[ -n "$function_name" && "$function_name" != "null" ]]
              log_group_name="/aws/lambda/$function_name"
              groups_json="$(aws logs describe-log-groups --log-group-name-prefix "$log_group_name" --output json)"
              if jq -e --arg name "$log_group_name" '.logGroups[] | select(.logGroupName == $name)' <<<"$groups_json" >/dev/null; then
                pending_ids+=("$1")
                pending_pairs+=("$1=$2")
                import_json="$(jq --arg id "$1" --arg name "$log_group_name" '. + [{ResourceType: "AWS::Logs::LogGroup", LogicalResourceId: $id, ResourceIdentifier: {LogGroupName: $name}}]' <<<"$import_json")"
              else
                echo "$1: log group $log_group_name does not exist yet; skipping import - the deploy step will create it from the template."
              fi
            fi
          done
          if (( ${#pending_ids[@]} == 0 )); then
            echo "Nothing to import: every template log group is already stack-managed or does not exist yet."
            exit 0
          fi
          workdir="$(mktemp -d)"
          aws cloudformation get-template --stack-name "$STACK_NAME" --output json | jq -r '.TemplateBody' > "$workdir/current.yaml"
          python3 - "$workdir/current.yaml" template.yaml "$workdir/import.yaml" "$workdir/params.json" "${pending_pairs[@]}" <<'PYEOF'
          import json
          import re
          import sys

          current_path, repo_path, out_path, params_path = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          pairs = [arg.split("=", 1) for arg in sys.argv[5:]]
          ids = [pair[0] for pair in pairs]
          current_text = open(current_path).read()

          if current_text.lstrip().startswith("{"):
              # SAM deploys store the stack template as JSON, so get-template returns
              # JSON: merge the log group resources structurally instead of scanning
              # for YAML lines that do not exist in JSON text.
              template = json.loads(current_text)
              resources = template.setdefault("Resources", {})
              for logical_id, function_id in pairs:
                  if logical_id in resources:
                      raise SystemExit(logical_id + " already present in current template")
                  # IMPORT change sets require a DeletionPolicy on every imported
                  # resource (attempt 10, run 40055297531). Retain: logs survive.
                  resources[logical_id] = {
                      "Type": "AWS::Logs::LogGroup",
                      "DeletionPolicy": "Retain",
                      "UpdateReplacePolicy": "Retain",
                      "Properties": {
                          "LogGroupName": {"Fn::Sub": "/aws/lambda/${" + function_id + "}"},
                          "RetentionInDays": 90,
                      },
                  }
              open(out_path, "w").write(json.dumps(template, separators=(",", ":")) + "\n")
              params = [{"ParameterKey": key, "UsePreviousValue": True} for key in template.get("Parameters", {})]
              open(params_path, "w").write(json.dumps(params))
              print("merged " + str(len(pairs)) + " log group resources into the JSON template")
          else:
              def extract_block(lines, logical_id):
                  start = None
                  for i, line in enumerate(lines):
                      if line.rstrip("\n") == "  " + logical_id + ":":
                          start = i
                          break
                  if start is None:
                      raise SystemExit("resource block not found: " + logical_id)
                  end = start + 1
                  while end < len(lines):
                      line = lines[end]
                      if re.match(r"^  \S", line) or re.match(r"^\S", line):
                          break
                      end += 1
                  block = lines[start:end]
                  while block and block[-1].strip() == "":
                      block.pop()
                  return block

              repo_lines = open(repo_path).read().splitlines(keepends=True)
              current_lines = current_text.splitlines(keepends=True)
              blocks = []
              for logical_id in ids:
                  if re.search(r"^  " + re.escape(logical_id) + ":", current_text, flags=re.M):
                      raise SystemExit(logical_id + " already present in current template")
                  blocks.extend(extract_block(repo_lines, logical_id))
                  blocks.append("\n")
              res_idx = None
              for i, line in enumerate(current_lines):
                  if line.rstrip("\n") == "Resources:":
                      res_idx = i
                      break
              if res_idx is None:
                  raise SystemExit("Resources: line not found in current template")
              out_lines = current_lines[: res_idx + 1] + blocks + current_lines[res_idx + 1:]
              param_keys = []
              in_params = False
              for line in repo_lines:
                  if line.rstrip("\n") == "Parameters:":
                      in_params = True
                      continue
                  if in_params:
                      if re.match(r"^\S", line):
                          break
                      m = re.match(r"^  ([A-Za-z0-9]+):", line)
                      if m:
                          param_keys.append(m.group(1))
              params = [{"ParameterKey": key, "UsePreviousValue": True} for key in param_keys]
              open(params_path, "w").write(json.dumps(params))
              open(out_path, "w").write("".join(out_lines))
              print("spliced " + str(len(ids)) + " log group blocks after Resources:")
          PYEOF
          printf '%s' "$import_json" > "$workdir/import.json"
          template_bytes="$(wc -c < "$workdir/import.yaml")"
          if (( template_bytes > 51200 )); then
            echo "Merged import template is ${template_bytes} bytes; the direct template-body limit is 51200." >&2
            exit 1
          fi
          changeset="import-log-groups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation create-change-set --stack-name "$STACK_NAME" --change-set-name "$changeset" --change-set-type IMPORT --resources-to-import "file://$workdir/import.json" --parameters "file://$workdir/params.json" --template-body "file://$workdir/import.yaml" --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND
          if ! aws cloudformation wait change-set-create-complete --stack-name "$STACK_NAME" --change-set-name "$changeset"; then
            echo "Import change set did not reach CREATE_COMPLETE; describing it before failing:" >&2
            aws cloudformation describe-change-set --stack-name "$STACK_NAME" --change-set-name "$changeset" --output json >&2 || true
            exit 1
          fi
          aws cloudformation execute-change-set --stack-name "$STACK_NAME" --change-set-name "$changeset"
          if ! aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"; then
            echo "Stack update did not complete after import execution; latest stack events:" >&2
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --output json | jq -r '.StackEvents[:15][] | .Timestamp + " " + .LogicalResourceId + " " + .ResourceStatus + " " + (.ResourceStatusReason // "")' >&2 || true
            exit 1
          fi
          after_json="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --output json)"
          for id in "${pending_ids[@]}"; do
            jq -e --arg id "$id" '.StackResources[] | select(.LogicalResourceId == $id)' <<<"$after_json" >/dev/null
          done
          echo "Imported into stack management: ${pending_ids[*]}"

      - name: Prepare dedicated production SAM artifact bucket
        id: artifact-bucket
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]
          region_hash="$(printf '%s' "$AWS_REGION" | sha256sum | cut -c1-8)"
          bucket="solvelang-api-access-production-artifacts-${account_id}-${region_hash}"
          (( ${#bucket} <= 63 ))
          aws s3api head-bucket --bucket "$bucket" >/dev/null
          aws s3api put-public-access-block --bucket "$bucket" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$bucket" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Assume production deploy role (refresh before redeploy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy current main while preserving the exact feature state
        id: deploy
        env:
          SAM_ARTIFACT_BUCKET: ${{ steps.artifact-bucket.outputs.bucket }}
          PRESERVED_TOTP_ENABLED: ${{ steps.before.outputs.totp_enabled }}
          PRESERVED_TOTP_KMS: ${{ steps.before.outputs.totp_kms }}
          PRESERVED_CRM_ENABLED: ${{ steps.before.outputs.crm_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          parameters=(
            ApiAccessEnabled="true"
            ApiAccessMode="live"
            CustomerAccountsEnabled="true"
            CustomerTotpEnabled="$PRESERVED_TOTP_ENABLED"
            CustomerTotpKmsKeyArn="$PRESERVED_TOTP_KMS"
            AdminCrmEnabled="$PRESERVED_CRM_ENABLED"
            SubscriptionBillingEnabled="true"
            SiteOrigin="$SITE_ORIGIN"
            ApiKeyPepper="$API_KEY_PEPPER"
            ApiAccessAdminSecret="$API_ACCESS_ADMIN_SECRET"
            CustomerAuthPepper="$CUSTOMER_AUTH_PEPPER"
            CustomerAuthEmailSender="$CUSTOMER_AUTH_EMAIL_SENDER"
            StripeSecretKey="$STRIPE_SECRET_KEY"
            StripeSubscriptionWebhookSecret="$STRIPE_SUBSCRIPTION_WEBHOOK_SECRET"
            StripeApiDeveloperPriceId="$STRIPE_API_DEVELOPER_PRICE_ID"
            StripeApiProPriceId="$STRIPE_API_PRO_PRICE_ID"
            StripeApiBusinessPriceId="$STRIPE_API_BUSINESS_PRICE_ID"
          )
          [[ -z "$CUSTOMER_AUTH_EMAIL_REPLY_TO" ]] || parameters+=(CustomerAuthEmailReplyTo="$CUSTOMER_AUTH_EMAIL_REPLY_TO")
          sam deploy \
            --stack-name "$STACK_NAME" \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --s3-prefix "$STACK_NAME-redeploy" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameters[@]}"

      - name: Verify redeploy preserved the feature state and the new code is live
        env:
          API_BASE: ${{ steps.before.outputs.api_base }}
          PRESERVED_TOTP_ENABLED: ${{ steps.before.outputs.totp_enabled }}
          PRESERVED_CRM_ENABLED: ${{ steps.before.outputs.crm_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          stack="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)"
          billing_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "SubscriptionBillingEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          crm_enabled="$(jq -r '[.Stacks[0].Parameters[]? | select(.ParameterKey == "AdminCrmEnabled") | .ParameterValue] | first // empty' <<<"$stack")"
          [[ "$billing_enabled" == true ]]
          [[ "$crm_enabled" == "$PRESERVED_CRM_ENABLED" ]]

          health="$(curl --fail --silent --show-error -H "x-solvelang-admin-secret: $API_ACCESS_ADMIN_SECRET" "$API_BASE/admin/status")"
          jq -e --argjson totp "$PRESERVED_TOTP_ENABLED" '.status == "ok" and .enabled == true and .customerAccountsEnabled == true and .customerTotpEnabled == $totp and .subscriptionBillingEnabled == true' <<<"$health" >/dev/null

          function_name="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --output json | jq -r '.StackResources[] | select(.LogicalResourceId == "ApiAccessFunction") | .PhysicalResourceId')"
          billing_flag="$(aws lambda get-function-configuration --function-name "$function_name" --output json | jq -r '.Environment.Variables.API_SUBSCRIPTION_BILLING_ENABLED // empty')"
          [[ "$billing_flag" == true ]]

          webhook_status="$(curl --silent --output /tmp/solvelang-webhook-enabled-probe.json --write-out '%{http_code}' -X POST "$API_BASE/stripe/subscriptions/webhook")"
          [[ "$webhook_status" == 400 ]]
          jq -e '.code == "invalid_webhook"' /tmp/solvelang-webhook-enabled-probe.json >/dev/null

      - name: Re-apply production operations baseline
        run: bash scripts/configure-production-foundation.sh "$STACK_NAME" "$AWS_REGION" "$OPERATIONS_ALARM_TOPIC_ARN"

      - name: Verify billing monitoring is armed
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --output json | jq -r '.StackResources[] | select(.LogicalResourceId == "ApiAccessFunction") | .PhysicalResourceId')"
          log_group="/aws/lambda/${function_name}"
          filter_name="$(aws logs describe-metric-filters --log-group-name "$log_group" --filter-name-prefix "${STACK_NAME}-subscription-webhook-failures" --output json | jq -r '.metricFilters[0].filterName // empty')"
          [[ "$filter_name" == "${STACK_NAME}-subscription-webhook-failures" ]]

          alarm="$(aws cloudwatch describe-alarms --alarm-names "${STACK_NAME}-subscription-webhook-failures" --output json)"
          jq -e \
            --arg topic "$OPERATIONS_ALARM_TOPIC_ARN" \
            '.MetricAlarms[0].ActionsEnabled == true
             and .MetricAlarms[0].TreatMissingData == "notBreaching"
             and .MetricAlarms[0].Threshold == 3
             and .MetricAlarms[0].Period == 300
             and .MetricAlarms[0].StateValue != "ALARM"
             and (.MetricAlarms[0].AlarmActions | index($topic)) != null' \
            <<<"$alarm" >/dev/null

      - name: Roll back the stack to its pre-redeploy revision if post-deploy verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation rollback-stack --stack-name "$STACK_NAME"
          aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"
          bash scripts/configure-production-foundation.sh "$STACK_NAME" "$AWS_REGION" "$OPERATIONS_ALARM_TOPIC_ARN"

      - name: Write deployment summary
        if: ${{ success() }}
        env:
          API_BASE: ${{ steps.before.outputs.api_base }}
          PRESERVED_TOTP_ENABLED: ${{ steps.before.outputs.totp_enabled }}
          PRESERVED_CRM_ENABLED: ${{ steps.before.outputs.crm_enabled }}
        shell: bash
        run: |
          {
            echo "## SolveLang production redeploy (state-preserving)"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Stack: \`$STACK_NAME\`"
            echo "- Region: \`$AWS_REGION\`"
            echo "- API base: \`$API_BASE\`"
            echo "- API access enabled: **true**"
            echo "- Customer accounts enabled: **true**"
            echo "- Authenticator 2FA state preserved: **$PRESERVED_TOTP_ENABLED**"
            echo "- Admin CRM state preserved: **$PRESERVED_CRM_ENABLED**"
            echo "- Subscription billing enabled: **true**"
            echo "- Reviewed Stripe merchant account: \`$STRIPE_EXPECTED_ACCOUNT_ID\`"
            echo "- Developer / Pro / Business recurring prices: verified with the runtime Stripe key"
            echo "- Subscription webhook route/signature gate: verified"
            echo "- Billing webhook failure monitoring: armed"
            echo "- Canary/customer charge performed by this workflow: **no**"
            echo
            echo "A separate explicitly authorized payment canary is still required before recording end-to-end charge evidence."
          } >> "$GITHUB_STEP_SUMMARY"
